<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#24313B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="On Point">
<title>On Point</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📍</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Leaflet core (inlined) */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;touch-action:none;-webkit-tap-highlight-color:transparent;outline-offset:1px}
.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow{user-select:none;-webkit-user-drag:none}
.leaflet-container img.leaflet-tile,.leaflet-container .leaflet-marker-pane img{max-width:none!important;max-height:none!important}
.leaflet-tile{visibility:hidden}.leaflet-tile-loaded{visibility:inherit}
.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-shadow-pane{z-index:500}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}
.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-zoom-anim .leaflet-tile,.leaflet-pan-anim .leaflet-tile{transition:none}
.leaflet-zoom-anim .leaflet-zoom-hide{visibility:hidden}
.leaflet-interactive{cursor:pointer}.leaflet-grab{cursor:grab}.leaflet-dragging .leaflet-grab{cursor:move}
.leaflet-pane>svg path{pointer-events:none}.leaflet-pane>svg path.leaflet-interactive,.leaflet-marker-icon.leaflet-interactive{pointer-events:auto}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}
.leaflet-control{position:relative;z-index:800;float:left;clear:both;pointer-events:auto}.leaflet-right .leaflet-control{float:right}
.leaflet-control-attribution{background:rgba(255,255,255,.8);margin:0;padding:0 5px;color:#333;line-height:1.4}
.leaflet-div-icon{background:none;border:0}
:root{
  --slate:#24313B; --slate-2:#34444F; --paper:#FAFAF7; --ink:#1C252C;
  --muted:#6B7A85; --line:#DCE0E2; --flag:#E0287D; --you:#1E7FD8;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--slate);overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--you);outline-offset:2px}

#map{position:absolute;inset:0;background:#DDE3E6}

/* Top bar */
.top{position:absolute;left:0;right:0;top:0;z-index:500;padding:calc(var(--safe-t) + 10px) 12px 10px;display:flex;align-items:center;gap:10px;background:var(--slate);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.brand{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:26px;letter-spacing:.5px;line-height:1;display:flex;align-items:center;gap:8px}
.brand svg{width:20px;height:26px}
.readout{margin-left:auto;text-align:right;font-size:13px;line-height:1.25;color:#C9D3DA;font-variant-numeric:tabular-nums}
.readout b{color:#fff;font-weight:600}
.icon-btn{border:0;background:var(--slate-2);color:#fff;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none}
.icon-btn svg{width:22px;height:22px}

/* Floating controls */
.fab-col{position:absolute;right:12px;bottom:calc(var(--safe-b) + 84px);z-index:500;display:flex;flex-direction:column;gap:10px}
.fab{width:52px;height:52px;border-radius:14px;border:0;background:var(--paper);color:var(--ink);box-shadow:0 3px 10px rgba(0,0,0,.25);display:grid;place-items:center}
.fab svg{width:26px;height:26px}
.fab.on{color:var(--you)}
.dock{position:absolute;left:12px;right:12px;bottom:calc(var(--safe-b) + 14px);z-index:500;display:flex;gap:10px}
.dock button{flex:1;height:54px;border:0;border-radius:14px;font-weight:600;font-size:17px;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.btn-flag{background:var(--flag);color:#fff}
.btn-plain{background:var(--paper);color:var(--ink)}
.calbar{position:absolute;left:12px;right:12px;top:calc(var(--safe-t) + 70px);z-index:600;background:#FFF4E8;border:1.5px solid #F2B37A;color:var(--ink);border-radius:12px;padding:10px 12px;display:none;align-items:center;gap:10px;font-size:14px;line-height:1.35;box-shadow:0 3px 10px rgba(0,0,0,.18)}
.calbar.show{display:flex}
.calbar b{display:block;font-size:15px}
.calbar button{margin-left:auto;border:0;background:#fff;border-radius:8px;padding:8px 12px;font-weight:600;flex:none}
.calbar .spin{width:22px;height:22px;border-radius:50%;border:3px solid #F2B37A;border-top-color:#F28C28;animation:sp 1s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.hint{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--safe-t) + 72px);z-index:500;background:rgba(36,49,59,.92);color:#fff;padding:8px 14px;border-radius:20px;font-size:14px;white-space:nowrap;pointer-events:none;transition:opacity .4s}

/* Sheet */
.scrim{position:absolute;inset:0;z-index:900;background:rgba(20,28,34,.35);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:1000;background:var(--paper);border-radius:18px 18px 0 0;padding:8px 18px calc(var(--safe-b) + 18px);max-height:78%;overflow-y:auto;transform:translateY(105%);transition:transform .25s ease;box-shadow:0 -4px 20px rgba(0,0,0,.2)}
.sheet.show{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sheet h2{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:28px;margin:0 0 2px;line-height:1.1}
.coords{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;margin-bottom:14px}
label.f{display:block;font-weight:600;font-size:15px;margin:12px 0 6px}
input[type=text],textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;font-size:17px}
textarea{min-height:96px;resize:vertical;line-height:1.45}
input[type=text]:focus,textarea:focus{border-color:var(--slate);outline:none}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6)}
.sw[aria-pressed=true]{border-color:var(--ink)}
.row{display:flex;gap:10px;margin-top:18px}
.row button{flex:1;height:50px;border-radius:12px;border:0;font-weight:600;font-size:16px}
.b-primary{background:var(--slate);color:#fff}
.b-flag{background:var(--flag);color:#fff}
.b-ghost{background:#EEF0F1;color:var(--ink)}
.b-danger{background:#fff;color:#B3261E;border:1.5px solid #E6C3C0 !important}
.note-body{font-size:17px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word;margin:6px 0 4px}
.note-empty{color:var(--muted);font-style:italic}
.meta{font-size:14px;color:var(--muted);margin-top:10px}
.dist{display:inline-block;background:#EEF0F1;border-radius:8px;padding:3px 9px;font-weight:600;color:var(--ink);font-size:14px;margin-right:6px}

/* List */
.list{list-style:none;margin:6px 0 0;padding:0}
.list li button{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:13px 2px;display:flex;align-items:center;gap:12px}
.list .dot{width:14px;height:14px;border-radius:50%;flex:none}
.list .t{font-weight:600;font-size:17px;display:block}
.list .s{font-size:14px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:62vw}
.list .d{margin-left:auto;font-size:14px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{padding:22px 0 8px;color:var(--muted);font-size:16px;line-height:1.5}
.tools{display:flex;gap:10px;margin-top:16px}
.tools button{flex:1;height:44px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:600}

/* First-person camera view */
.ar{position:fixed;inset:0;z-index:1100;background:#000;display:none;overflow:hidden}
.ar.show{display:block}
.ar video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ar-labels{position:absolute;inset:0}
.ar-top{position:absolute;left:0;right:0;top:0;padding:calc(var(--safe-t) + 10px) 12px 10px;display:flex;align-items:center;gap:10px;background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,0));color:#fff;z-index:3}
.ar-top .hd{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:26px;letter-spacing:.5px}
.ar-top .sub{font-size:13px;opacity:.8}
.ar-top button{margin-left:auto;width:44px;height:44px;border-radius:12px;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:22px}
.ar-bot{position:absolute;left:0;right:0;bottom:0;padding:10px 12px calc(var(--safe-b) + 12px);background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.6));color:#fff;z-index:3}
.ar-chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.ar-chips button{flex:none;border:1.5px solid rgba(255,255,255,.5);background:rgba(0,0,0,.35);color:#fff;border-radius:18px;padding:7px 12px;font-size:14px;font-weight:600}
.ar-chips button[aria-pressed=true]{background:#fff;color:var(--ink);border-color:#fff}
.ar-range{display:flex;align-items:center;gap:10px;font-size:13px}
.ar-range input{flex:1}
.ar-horizon{position:absolute;left:0;right:0;height:0;border-top:1px dashed rgba(255,255,255,.35);z-index:1;pointer-events:none}
.ar-tag{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;z-index:2;cursor:pointer}
.ar-tag .pill{background:rgba(250,250,247,.94);color:var(--ink);border-radius:10px;padding:5px 9px;font-size:13px;line-height:1.2;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.35);text-align:center}
.ar-tag .pill b{display:block;font-size:14px}
.ar-tag .stem{width:2px;background:rgba(255,255,255,.85);box-shadow:0 0 2px rgba(0,0,0,.6)}
.ar-tag .dotp{width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid var(--ink)}
.ar-edge{position:absolute;top:50%;z-index:2;background:rgba(0,0,0,.5);color:#fff;border-radius:8px;padding:5px 8px;font-size:12px;pointer-events:none}
.ar-msg{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);background:rgba(0,0,0,.6);color:#fff;padding:12px 16px;border-radius:12px;font-size:15px;text-align:center;max-width:80vw;z-index:4;display:none;cursor:pointer}
/* Toast */
.toast{position:absolute;left:50%;bottom:calc(var(--safe-b) + 84px);transform:translate(-50%,20px);z-index:1200;background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:15px;opacity:0;pointer-events:none;transition:all .25s;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Markers */
.you-dot{width:18px;height:18px;border-radius:50%;background:var(--you);border:3px solid #fff;box-shadow:0 0 0 2px rgba(30,127,216,.35),0 1px 4px rgba(0,0,0,.4)}
.you{position:relative;width:110px;height:110px;pointer-events:none}
.you .you-dot{position:absolute;left:46px;top:46px}
.you .arrow{position:absolute;left:39px;top:39px;width:32px;height:32px;display:none;transition:transform .15s linear;filter:drop-shadow(0 1px 3px rgba(0,0,0,.45))}
.you.moving .arrow{display:block}.you.moving .you-dot{display:none}
.you .cone{position:absolute;left:0;top:0;width:110px;height:110px;display:none;transition:transform .2s ease-out}
.you .cone.on{display:block}
.navcard{position:absolute;left:0;right:0;bottom:0;z-index:940;background:var(--paper);border-radius:18px 18px 0 0;padding:12px 16px calc(var(--safe-b) + 14px);box-shadow:0 -4px 20px rgba(0,0,0,.25);display:none}
.navcard.show{display:block}
.navcard h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:24px;margin:0;line-height:1.15}
.navcard .nsub{font-size:14px;color:var(--muted);margin:2px 0 8px}
.nstats{display:flex;gap:10px;margin:6px 0}
.nstat{flex:1;background:#EEF0F1;border-radius:12px;padding:8px 10px}
.nstat small{display:block;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.nstat b{font-size:20px;font-variant-numeric:tabular-nums}
.nav-tip{background:var(--slate)!important;color:#fff!important;border:0!important;border-radius:8px!important;font:600 13px/1.2 "Barlow",system-ui,sans-serif!important;padding:4px 8px!important;box-shadow:0 1px 5px rgba(0,0,0,.35)!important;white-space:nowrap}
.nav-tip::before{display:none}
.leaflet-tooltip{position:absolute;pointer-events:none}
.nav-target{width:30px;height:30px;border-radius:50%;border:4px solid #E0287D;background:rgba(224,40,125,.2);box-shadow:0 0 0 3px #fff}
.dlpanel{position:absolute;left:0;right:0;bottom:0;z-index:950;background:var(--paper);border-radius:18px 18px 0 0;padding:12px 14px calc(var(--safe-b) + 14px);box-shadow:0 -4px 20px rgba(0,0,0,.25);display:none}
.dlpanel.show{display:block}
.dlpanel h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:22px;margin:0 0 4px}
.seg{display:flex;gap:8px;margin:6px 0}
.seg button{flex:1;height:40px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:15px}
.seg button[aria-pressed=true]{background:var(--slate);color:#fff;border-color:var(--slate)}
.dlp-hint{font-size:14px;color:var(--muted);line-height:1.4;margin:4px 0}
.dlp-est{font-size:15px;font-weight:600;margin:6px 0 0}
.dl-h{width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid #E0287D;box-shadow:0 1px 5px rgba(0,0,0,.4)}
.dl-mv{width:40px;height:40px;border-radius:50%;background:#E0287D;color:#fff;display:grid;place-items:center;font-size:20px;border:3px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.4)}
.dl-pt{width:14px;height:14px;border-radius:50%;background:#E0287D;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.temp-ic{display:flex;align-items:center;justify-content:center}
.temp-ic span{font:700 15px/1 "Barlow Condensed","Arial Narrow",sans-serif;color:#fff;padding:5px 7px;border-radius:9px;border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.35);white-space:nowrap}
.tower-ic svg{display:block;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.45))}
.flag-pin svg{display:block;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.leaflet-control-attribution{font-size:10px}
.leaflet-top{top:calc(var(--safe-t) + 62px)}
/* Layers sheet */
.sec{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:18px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.opt{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px}
.opt[aria-pressed=true],.opt[aria-checked=true]{border-color:var(--slate);box-shadow:inset 0 0 0 1px var(--slate)}
.opt .ot{font-weight:600;font-size:16px;display:block}
.opt .od{font-size:13.5px;color:var(--muted);display:block;line-height:1.35}
.opt .mk{margin-left:auto;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.opt[aria-pressed=true] .mk,.opt[aria-checked=true] .mk{background:var(--slate);border-color:var(--slate)}
.opt[aria-pressed=true] .mk::after,.opt[aria-checked=true] .mk::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
.opt.sw-t .mk{border-radius:7px}
.fine{font-size:13px;color:var(--muted);line-height:1.45;margin-top:10px}
/* Compass */
#needle{transition:transform .15s linear}
.fab.head{background:var(--slate);color:#fff}
/* Legend */
.legend{position:absolute;left:12px;bottom:calc(var(--safe-b) + 84px);z-index:500;background:rgba(250,250,247,.95);border-radius:10px;padding:7px 10px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.2);width:170px;display:none}
.legend.show{display:block}
.legend .bar{height:10px;border-radius:5px;background:linear-gradient(90deg,#2b0f6b,#1f4bd1,#1fb3d9,#3fcf7a,#e8e23a,#f08a24,#c81e1e);margin:4px 0 2px}
.legend .ends{display:flex;justify-content:space-between;color:var(--muted)}
/* Pin water data */
.two{display:flex;gap:10px}.two>div{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 4px}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div id="map" role="application" aria-label="Map"></div>
<svg id="navSvg" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:450;overflow:visible"></svg>

<header class="top">
  <div class="brand">
    <svg viewBox="0 0 20 26" aria-hidden="true"><path d="M3 1v24" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/><path d="M4 2h13l-3.5 5L17 12H4z" fill="#E0287D"/></svg>
    On Point
  </div>
  <div class="readout" id="readout" aria-live="polite">Finding you…</div>
  <button class="icon-btn" id="layerBtn" aria-label="Map layers" title="Map layers">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3 2 8l10 5 10-5z"/><path d="m2 13 10 5 10-5"/></svg>
  </button>
</header>

<div class="hint" id="hint">Tap the map to drop a pin</div>
<div class="calbar" id="dlbanner" role="status" style="flex-wrap:wrap"><span style="flex:1;min-width:0"><b id="dlbT">Downloading…</b><span id="dlbS"></span>
  <span style="display:block;height:8px;border-radius:4px;background:#F6D9BC;overflow:hidden;margin-top:6px"><span id="dlbBar" style="display:block;height:100%;width:0;background:#E0287D;transition:width .2s"></span></span></span><button id="dlbStop">Cancel</button></div>
<div class="calbar" id="calbar" role="status"><span class="spin" aria-hidden="true"></span><span><b>Calibrating compass</b><span id="calMsg">Wave the phone in a figure‑8, then move in a straight line with it pointed ahead</span></span><button id="calSkip">Skip</button></div>

<div class="legend" id="legend" aria-hidden="true"><b id="legendTitle">Water temp</b><div class="bar"></div><div class="ends"><span>Colder</span><span>Warmer</span></div></div>

<div class="fab-col">
  <button class="fab" id="arBtn" aria-label="First-person camera view" title="Look around">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 8h3.5L8 5.5h8L17.5 8H21v11H3z"/><circle cx="12" cy="13.5" r="3.6"/></svg>
  </button>
  <button class="fab" id="compassBtn" aria-label="Compass: tap to point north, tap again to follow your heading" title="Compass">
    <svg viewBox="0 0 24 24" aria-hidden="true"><g id="needle" style="transform-origin:12px 12px"><path d="M12 2.5 15 12H9z" fill="#E0287D"/><path d="M12 21.5 9 12h6z" fill="currentColor" opacity=".55"/></g><circle cx="12" cy="12" r="1.6" fill="#fff"/></svg>
  </button>
  <button class="fab" id="locBtn" aria-label="Center on my location" title="Center on me">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></svg>
  </button>
</div>

<nav class="dock">
  <button class="btn-plain" id="listBtn">Pins (<span id="count">0</span>)</button>
  <button class="btn-flag" id="pinHereBtn">Pin where I am</button>
</nav>

<div class="navcard" id="navcard" role="dialog" aria-label="Route">
  <h3 id="navName"></h3><div class="nsub" id="navSub"></div>
  <div class="nstats">
    <div class="nstat"><small>Straight line</small><b id="navStraight">—</b></div>
    <div class="nstat"><small id="navRouteLbl">By road</small><b id="navRoute">—</b></div>
  </div>
  <div class="seg" id="navMode"><button data-m="car" aria-pressed="true">🚗 Drive</button><button data-m="foot" aria-pressed="false">🚶 Walk</button><button data-m="bike" aria-pressed="false">🚲 Bike</button></div>
  <div class="row" style="margin-top:6px"><button class="b-ghost" id="navPin">⚑ Pin it</button><button class="b-ghost" id="navG">Google Maps</button><button class="b-ghost" id="navA">Apple Maps</button></div>
  <div class="row" style="margin-top:8px"><button class="b-ghost" id="navCam">📷 Back to camera</button><button class="b-primary" id="navEnd">Done</button></div>
</div>

  <h3>Choose what to download</h3>
  <div class="seg" id="dlpMode"><button data-m="box" aria-pressed="true">▭ Box</button><button data-m="trail" aria-pressed="false">〰 Trail / route</button></div>
  <div class="dlp-hint" id="dlpHint"></div>
  <div class="seg" id="dlpWidth" style="display:none"><button data-w="0.1">Narrow</button><button data-w="0.25" aria-pressed="true">¼ mi</button><button data-w="0.5">½ mi</button><button data-w="1">1 mi</button></div>
  <div class="seg" id="dlpTrailBtns" style="display:none"><button id="dlpUndo">↶ Undo point</button><button id="dlpClear">Clear</button></div>
  <div class="seg" id="dlpMaps"><button data-l="usgs" aria-pressed="true">Topo map</button><button data-l="usgsimg" aria-pressed="false">Satellite + names</button></div>
  <div class="dlp-est" id="dlpEst"></div>
  <div class="row" style="margin-top:10px"><button class="b-ghost" id="dlpCancel">Cancel</button><button class="b-flag" id="dlpGo">Download</button></div>
</div>

  <div class="grab"></div>

</section>

  <video id="arVideo" playsinline muted autoplay></video>
  <div class="ar-horizon" id="arHorizon"></div>

  <div class="ar-msg" id="arMsg"></div>
  <div class="ar-top"><div><div class="hd" id="arHead">—</div><div class="sub" id="arSub">Point your phone at what you want to know</div></div><button id="arReload" aria-label="Reload labels" style="margin-left:auto">↻</button><button id="arClose" aria-label="Close camera view" style="margin-left:0">✕</button></div>
  <div class="ar-bot">
    <div class="ar-chips" id="arChips"></div>
    <div id="arDiag" style="font:12px/1.35 ui-monospace,Menlo,monospace;opacity:.85;margin-bottom:6px;white-space:pre-wrap"></div>
    <div class="ar-range"><span>Range</span><input type="range" id="arRange" min="1" max="60" step="1" value="25" aria-label="How far to show"><span id="arRangeV">25 mi</span></div>
  </div>
</section>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet-rotate@0.2.7/dist/leaflet-rotate-src.js"></script>
<script>
(function(){
  const KEY='onpoint.pins.v1';
  const COLORS=['#E0287D','#F28C28','#2E9E5B','#1E7FD8','#7B4FD1','#24313B'];
  const $=id=>document.getElementById(id);
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // ---------- storage ----------
  function load(){try{const v=JSON.parse(localStorage.getItem(KEY));return Array.isArray(v)?v:[]}catch(e){return[]}}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(pins))}catch(e){toast('Could not save — storage is full or blocked')}}
  let pins=load();

  // ---------- map ----------
  const map=L.map('map',{zoomControl:false,attributionControl:true,rotate:true,touchRotate:true,rotateControl:false,bearing:0}).setView([33.75,-84.39],12);
  const canRotate=typeof map.setBearing==='function';

  // NOAA nautical charts come from an Esri export endpoint, so build a tile URL from each tile's box
  const EsriExport=L.TileLayer.extend({
    getTileUrl(c){
      const b=this._tileCoordsToBounds(c),P=L.CRS.EPSG3857;
      const nw=P.project(b.getNorthWest()),se=P.project(b.getSouthEast());
      return this._url+'?bbox='+[nw.x,se.y,se.x,nw.y].join(',')+'&bboxSR=3857&imageSR=3857&size=256,256&format=png32&transparent=true&f=image';
    }
  });
  const gibs=name=>`https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/${name}/default/default/GoogleMapsCompatible_Level7/{z}/{y}/{x}.png`;

  const USGS=n=>`https://basemap.nationalmap.gov/arcgis/rest/services/${n}/MapServer/tile/{z}/{y}/{x}`;
  let usgsCors=true;try{usgsCors=localStorage.getItem('onpoint.usgsCors')!=='0'}catch(e){}
  const usgsOpts=()=>Object.assign({maxZoom:20,maxNativeZoom:16,attribution:'USGS The National Map'},usgsCors?{crossOrigin:'anonymous'}:{});
  const BASES={
    street:{name:'Street',desc:'Roads, trails and place names',layer:L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{crossOrigin:'anonymous',maxZoom:20,maxNativeZoom:19,attribution:'© OpenStreetMap'})},
    sat:{name:'Satellite',desc:'Aerial photos',layer:L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{crossOrigin:'anonymous',maxZoom:20,maxNativeZoom:17,attribution:'Imagery © Esri'})},
    topo:{name:'Topo',desc:'Terrain contour lines, shorelines and creeks',layer:L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{crossOrigin:'anonymous',maxZoom:20,maxNativeZoom:17,attribution:'© OpenTopoMap, OpenStreetMap'})},
    usgs:{name:'USGS Topo ⬇',desc:'Government topo map with roads, creeks & names — can be downloaded for offline',layer:L.tileLayer(USGS('USGSTopo'),usgsOpts())},
    usgsimg:{name:'USGS Satellite + names ⬇',desc:'Aerial photos with road & place names — can be downloaded for offline',layer:L.tileLayer(USGS('USGSImageryTopo'),usgsOpts())},
    ocean:{name:'Ocean depth',desc:'Sea-floor shading by depth, offshore and along the coast',layer:L.layerGroup([
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Base/MapServer/tile/{z}/{y}/{x}',{crossOrigin:'anonymous',maxZoom:20,maxNativeZoom:13,attribution:'Ocean © Esri, GEBCO, NOAA'}),
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Reference/MapServer/tile/{z}/{y}/{x}',{crossOrigin:'anonymous',maxZoom:20,maxNativeZoom:13})])}
  };
  // Cell towers: FCC licensing data via HIFLD, fetched for whatever area is on screen
  const TOWER_URL='https://services2.arcgis.com/FiaPA4ga0iQKduv3/arcgis/rest/services/Cellular_Towers_in_the_United_States/FeatureServer/0/query';
  const towers=L.layerGroup();
  const towerIcon=L.divIcon({className:'tower-ic',iconSize:[22,26],iconAnchor:[11,25],
    html:'<svg width="22" height="26" viewBox="0 0 22 26"><path d="M11 6 6 25M11 6l5 19M7.6 18h6.8M8.9 12.5h4.2" stroke="#24313B" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="11" cy="5" r="2.6" fill="#F28C28" stroke="#fff" stroke-width="1"/><path d="M5 1.5a8 8 0 0 0 0 7M17 1.5a8 8 0 0 1 0 7" stroke="#F28C28" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>'});
  let towerSeq=0,towerTimer=null,towerWarned=false;
  const towerCache=new Map();
  async function loadTowers(){
    if(!map.hasLayer(towers))return;
    if(map.getZoom()<11){towers.clearLayers();if(!towerWarned){toast('Zoom in closer to see cell towers');towerWarned=true}return}
    towerWarned=false;
    const b=map.getBounds().pad(0.15),seq=++towerSeq;
    const q=new URLSearchParams({where:'1=1',geometry:[b.getWest(),b.getSouth(),b.getEast(),b.getNorth()].join(','),
      geometryType:'esriGeometryEnvelope',inSR:'4326',spatialRel:'esriSpatialRelIntersects',outFields:'*',outSR:'4326',
      returnGeometry:'true',resultRecordCount:'500',f:'json'});
    try{
      const r=await fetch(TOWER_URL+'?'+q);const d=await r.json();
      if(seq!==towerSeq||!map.hasLayer(towers))return;
      if(d.error)throw new Error(d.error.message);
      towers.clearLayers();
      (d.features||[]).forEach(f=>{
        if(!f.geometry)return;
        const t={lat:f.geometry.y,lng:f.geometry.x,a:f.attributes||{}};
        const id='t'+t.lat.toFixed(5)+t.lng.toFixed(5);towerCache.set(id,t);
        L.marker([t.lat,t.lng],{icon:towerIcon,title:'Cell tower'}).on('click',()=>showTower(id)).addTo(towers);
      });
      if(!(d.features||[]).length)toast('No listed towers in this area');
    }catch(e){if(seq===towerSeq)toast('Couldn’t load cell towers right now')}
  }
  towers.on('add',loadTowers);
  map.on('moveend',()=>{clearTimeout(towerTimer);towerTimer=setTimeout(loadTowers,350)});
  function pick(a,re){const k=Object.keys(a).find(k=>re.test(k)&&a[k]!==null&&a[k]!==''&&a[k]!==' ');return k?a[k]:null}
  function showTower(id){
    const t=towerCache.get(id);if(!t)return;const a=t.a;
    const owner=pick(a,/licens|owner|entity|company/i),call=pick(a,/call/i),
      h=pick(a,/struc.*h|height|hgt|agl/i),city=pick(a,/city/i),st=pick(a,/^(loc)?state$|locstate/i);
    const skip=/objectid|fid|shape|globalid|^x$|^y$|lat|lon/i;
    const extra=Object.entries(a).filter(([k,v])=>v!==null&&v!==''&&v!==' '&&!skip.test(k)).slice(0,14)
      .map(([k,v])=>`<div><b>${esc(k)}:</b> ${esc(v)}</div>`).join('');
    openSheet(`<h2 id="sheetTitle">Cell tower</h2>
      <div class="coords">${t.lat.toFixed(6)}, ${t.lng.toFixed(6)}</div>
      ${me?`<span class="dist">${distLabel(t)}</span>`:''}
      <div class="note-body">${owner?esc(owner):'Licensee not listed'}${call?`<br><span class="note-empty" style="font-style:normal">Call sign ${esc(call)}</span>`:''}${h?`<br>Height: ${esc(h)}`:''}${city?`<br>${esc(city)}${st?', '+esc(st):''}`:''}</div>
      <details class="meta"><summary>All FCC details</summary><div style="margin-top:6px;line-height:1.5">${extra||'None'}</div></details>
      <div class="row"><button class="b-primary" id="tNav">Directions</button><button class="b-flag" id="tPin">Pin it</button></div>`);
    $('tNav').onclick=()=>{closeSheet();startNav({name:owner||'Cell tower',sub:'Cell tower',icon:'📡',lat:t.lat,lng:t.lng})};
    $('tPin').onclick=()=>{newPinAt(t.lat,t.lng);setTimeout(()=>{const f=$('fTitle');if(f)f.value='Cell tower'+(owner?' – '+owner:'')},30)};
  }

  // Live air temperature on land (Open-Meteo, free weather service): a grid of readings across the map
  const airLayer=L.layerGroup();
  let airTimer=null,airSeq=0;
  function tempColor(f){
    const stops=[[10,'#4B2991'],[32,'#2166AC'],[50,'#4393C3'],[62,'#5AAE61'],[72,'#D9C21C'],[82,'#F28C28'],[92,'#D6301F'],[105,'#7F0000']];
    for(let i=1;i<stops.length;i++)if(f<stops[i][0])return stops[i-1][1];return stops[stops.length-1][1];
  }
  async function loadAir(){
    if(!map.hasLayer(airLayer))return;
    const b=map.getBounds(),seq=++airSeq,z=map.getZoom();
    const cols=z>=13?2:z>=10?3:4,rows=Math.round(cols*Math.max(1,map.getSize().y/map.getSize().x));
    const pts=[];
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)
      pts.push([b.getNorth()-(r+.5)*(b.getNorth()-b.getSouth())/rows, b.getWest()+(c+.5)*(b.getEast()-b.getWest())/cols]);
    const url=`https://api.open-meteo.com/v1/forecast?latitude=${pts.map(p=>p[0].toFixed(3)).join(',')}&longitude=${pts.map(p=>p[1].toFixed(3)).join(',')}&current=temperature_2m&temperature_unit=fahrenheit`;
    try{
      const d=await (await fetch(url)).json();if(seq!==airSeq)return;
      const arr=Array.isArray(d)?d:[d];
      airLayer.clearLayers();
      arr.forEach((r,i)=>{const t=r&&r.current&&r.current.temperature_2m;if(typeof t!=='number')return;
        L.marker(pts[i],{interactive:false,icon:L.divIcon({className:'temp-ic',iconSize:[50,28],iconAnchor:[25,14],
          html:`<span style="background:${tempColor(t)}">${Math.round(t)}°</span>`})}).addTo(airLayer)});
    }catch(e){if(seq===airSeq)toast('Couldn’t load air temperatures')}
  }
  airLayer.on('add',loadAir);
  map.on('moveend',()=>{clearTimeout(airTimer);airTimer=setTimeout(loadAir,600)});
  setInterval(loadAir,15*60*1000);
  // Temperature where you are, shown in the top corner
  let myTemp=null,myTempAt=0;
  try{const v=JSON.parse(localStorage.getItem('onpoint.myTemp'));if(v){myTemp=v.t;myTempAt=v.at}}catch(e){}
  async function loadMyTemp(){
    if(!me||!navigator.onLine||Date.now()-myTempAt<10*60*1000)return;
    myTempAt=Date.now();
    try{const d=await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${me.lat.toFixed(3)}&longitude=${me.lng.toFixed(3)}&current=temperature_2m&temperature_unit=fahrenheit`)).json();
      const t=d&&d.current&&d.current.temperature_2m;
      if(typeof t==='number'){myTemp=t;try{localStorage.setItem('onpoint.myTemp',JSON.stringify({t,at:myTempAt}))}catch(e){}updateReadout()}
    }catch(e){myTempAt=0}
  }
  setInterval(()=>loadMyTemp(),60000);

  const OVERLAYS={
    chart:{name:'Nautical chart depths',desc:'NOAA charts with depth soundings and contours — coast, bays, big rivers and some large lakes',
      layer:new EsriExport('https://gis.charttools.noaa.gov/arcgis/rest/services/MCS/NOAAChartDisplay/MapServer/exts/MaritimeChartService/MapServer/export',{maxZoom:20,opacity:.9,zIndex:5,attribution:'Charts © NOAA'})},
    marks:{name:'Buoys & markers',desc:'Channel markers, buoys and lights (OpenSeaMap)',
      layer:L.tileLayer('https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png',{maxZoom:20,maxNativeZoom:18,zIndex:6,attribution:'© OpenSeaMap'})},
    sst:{name:'Ocean water temp',desc:'NASA daily sea-surface temperature, about 1 km detail',temp:'Ocean water temp',
      layer:L.tileLayer(gibs('GHRSST_L4_MUR_Sea_Surface_Temperature'),{crossOrigin:'anonymous',maxZoom:20,maxNativeZoom:7,opacity:.65,zIndex:4,attribution:'SST © NASA GIBS'})},
    towers:{name:'Cell towers',desc:'FCC-licensed cellular sites near you. Not every carrier site is listed. Zoom in to load',layer:towers},
    air:{name:'Air temperature (live)',desc:'Current temperature across the map, updated every 15 min',layer:airLayer},
    lst:{name:'Land & lake surface temp',desc:'NASA daily daytime surface temp. Gaps where it was cloudy',temp:'Surface temp',
      layer:L.tileLayer(gibs('MODIS_Terra_Land_Surface_Temp_Day'),{crossOrigin:'anonymous',maxZoom:20,maxNativeZoom:7,opacity:.65,zIndex:4,attribution:'LST © NASA GIBS'})}
  };
  const PREF='onpoint.layers.v1';
  let layerState={base:'street',on:[]};
  try{const v=JSON.parse(localStorage.getItem(PREF));if(v&&BASES[v.base])layerState={base:v.base,on:(v.on||[]).filter(k=>OVERLAYS[k])}}catch(e){}
  function applyLayers(){
    Object.entries(BASES).forEach(([k,b])=>{if(k===layerState.base){if(!map.hasLayer(b.layer))b.layer.addTo(map)}else map.removeLayer(b.layer)});
    Object.entries(OVERLAYS).forEach(([k,o])=>{if(layerState.on.includes(k)){if(!map.hasLayer(o.layer))o.layer.addTo(map)}else map.removeLayer(o.layer)});
    const t=layerState.on.map(k=>OVERLAYS[k].temp).filter(Boolean);
    $('legend').classList.toggle('show',t.length>0);
    $('legendTitle').textContent=t.join(' + ');
    $('layerBtn').style.background=(layerState.base!=='street'||layerState.on.length)?'#E0287D':'';
    try{localStorage.setItem(PREF,JSON.stringify(layerState))}catch(e){}
  }
  applyLayers();
  function showLayers(){
    const base=Object.entries(BASES).map(([k,b])=>`<button class="opt" role="radio" aria-checked="${k===layerState.base}" data-base="${k}"><span><span class="ot">${b.name}</span><span class="od">${b.desc}</span></span><span class="mk"></span></button>`).join('');
    const ov=Object.entries(OVERLAYS).map(([k,o])=>`<button class="opt sw-t" aria-pressed="${layerState.on.includes(k)}" data-ov="${k}"><span><span class="ot">${o.name}</span><span class="od">${o.desc}</span></span><span class="mk"></span></button>`).join('');
    openSheet(`<h2 id="sheetTitle">Map layers</h2>
      <div class="sec">Base map</div><div id="bases" role="radiogroup">${base}</div>
      <div class="sec">Overlays</div><div id="ovs">${ov}</div>
      <div class="sec">Offline</div>
      <button class="opt" id="offSave"><span><span class="ot">⬇ Download an area</span><span class="od">Drag a box — or trace a trail — over what you need, for use with no signal</span></span></button>
      <button class="opt" id="offManage"><span><span class="ot">Manage downloads</span><span class="od">See and delete saved areas</span></span></button>
      <p class="fine" id="offInfo" style="margin-top:2px"></p>
      <div class="sec">Compass</div>
      <button class="opt" id="calOpen"><span><span class="ot">Calibrate compass</span><span class="od">Line up the orange looking beam with the real world</span></span></button>
      <p class="fine">Temperature maps are the latest NASA satellite pass, usually a day or two old, and get blocky when you zoom in close. Free depth maps don't cover most inland lakes — log your own depth and water temp on pins for those.</p>
      <div class="row"><button class="b-primary" id="doneB">Done</button></div>
      <p class="fine" style="text-align:center">On Point · version 32 (Google Maps hand-off)</p>`);
    $('bases').onclick=e=>{const b=e.target.closest('[data-base]');if(!b)return;layerState.base=b.dataset.base;applyLayers();
      $('bases').querySelectorAll('[data-base]').forEach(x=>x.setAttribute('aria-checked',x===b));};
    $('ovs').onclick=e=>{const b=e.target.closest('[data-ov]');if(!b)return;const k=b.dataset.ov;
      layerState.on=layerState.on.includes(k)?layerState.on.filter(x=>x!==k):[...layerState.on,k];applyLayers();
      b.setAttribute('aria-pressed',layerState.on.includes(k));
      if(layerState.on.includes(k)&&(OVERLAYS[k].layer.options||{}).maxNativeZoom===7&&map.getZoom()>11)toast('Zoom out to see the temperature pattern');};
    $('doneB').onclick=closeSheet;
    $('calOpen').onclick=showCalibrate;
    $('offSave').onclick=()=>{closeSheet();startSelect()};
    $('offManage').onclick=showDownloads;
    idb.get('areas').then(a=>{const el=$('offInfo');if(!el)return;a=a||[];
      el.textContent=(a.length?`${a.length} area${a.length>1?'s':''} saved. `:'No areas saved yet. ')+
        'Map tiles you look at while online are kept automatically — pan and zoom around an area before you lose signal.'+
        (navigator.serviceWorker&&navigator.serviceWorker.controller?'':' (Offline app not active yet — reopen the app once.)')}).catch(()=>{});
  }
  $('layerBtn').onclick=showLayers;

  let calTick=null;
  function showCalibrate(){
    enableCompass(true);
    openSheet(`<h2 id="sheetTitle">Calibrate compass</h2>
      <p class="fine" style="margin-top:4px">First, wave your phone in a slow figure‑8 a few times, away from cars and metal. Then fine‑tune with one of these.</p>
      <div class="sec">Easiest: match to GPS</div>
      <p class="fine" style="margin-top:0">Walk or ride in a straight line holding the phone pointed straight ahead, then tap the button. GPS knows your true direction, so the compass gets corrected to it.</p>
      <div id="calLive" class="meta" style="margin:8px 0">Waiting for readings…</div>
      <div class="row" style="margin-top:6px"><button class="b-flag" id="calGps">Match to GPS now</button></div>
      <div class="sec">Or adjust by hand</div>
      <p class="fine" style="margin-top:0">Point the phone at something you can see on the map (down a straight road, at a building), then slide until the orange beam points at it.</p>
      <input type="range" id="calSlide" min="-90" max="90" step="1" value="${Math.round(compassOffset)}" style="width:100%;margin:10px 0" aria-label="Compass correction in degrees">
      <div class="meta" id="calVal"></div>
      <div class="sec">Every time</div>
      <button class="opt sw-t" id="calAuto" aria-pressed="${autoCal}"><span><span class="ot">Auto-calibrate when I open the app</span><span class="od">Corrects the compass the first time you move in a straight line with the phone pointed ahead</span></span><span class="mk"></span></button>
      <div class="row"><button class="b-ghost" id="calReset">Reset</button><button class="b-primary" id="calDone">Done</button></div>`);
    $('calAuto').onclick=()=>{autoCal=!autoCal;$('calAuto').setAttribute('aria-pressed',autoCal);
      try{localStorage.setItem('onpoint.autoCal',autoCal?'1':'0')}catch(e){}
      if(autoCal)startAutoCal();else stopAutoCal(null);};
    const showVal=()=>{$('calVal').textContent=`Correction: ${compassOffset>0?'+':''}${Math.round(compassOffset)}°`;$('calSlide').value=Math.round(compassOffset)};
    showVal();
    calTick=()=>{const el=$('calLive');if(!el)return;
      const g=(gpsSpeed>=1&&gpsHeading!=null)?Math.round(gpsHeading)+'°':'not moving';
      el.textContent=`Compass: ${compassH==null?'—':Math.round(compassH)+'°'}   ·   GPS travel: ${g}`;};
    calTick();
    $('calSlide').oninput=e=>{setOffset(+e.target.value);showVal()};
    $('calGps').onclick=()=>{
      if(compassRaw==null){toast('No compass reading yet — allow motion access');return}
      if(!(gpsSpeed>=1&&gpsHeading!=null)){toast('Start moving in a straight line first');return}
      let off=((gpsHeading-compassRaw)%360+540)%360-180;setOffset(off);showVal();toast(`Corrected by ${Math.round(off)}°`);
    };
    $('calReset').onclick=()=>{setOffset(0);showVal();toast('Correction cleared')};
    $('calDone').onclick=()=>{calTick=null;closeSheet()};
  }

  const flagIcon=c=>L.divIcon({className:'flag-pin',iconSize:[28,40],iconAnchor:[5,38],popupAnchor:[8,-34],

  // What kind of thing is it? (icon + short description from OpenStreetMap tags)

    if(a==='place_of_worship')return ['✝',t.religion==='christian'||!t.religion?'Church':'Place of worship'];
    if(t.power)return ['⚡',t.power==='substation'?'Substation':title(t.power)];
    if(a==='grave_yard'||t.landuse==='cemetery')return ['🪦','Cemetery'];
    if(/^(school|college|university|kindergarten)$/.test(a))return ['🏫',title(a)];
    if(a==='fire_station')return ['🚒','Fire station'];
    if(a==='police')return ['🚓','Police'];
    if(/^(hospital|clinic|doctors|pharmacy)$/.test(a))return ['🏥',title(a)];
    if(a==='fuel')return ['⛽','Gas station'];
    if(/^(restaurant|fast_food|cafe|bar|pub)$/.test(a))return ['🍴',title(a)];
    if(a==='post_office')return ['📮','Post office'];
    if(a==='library')return ['📚','Library'];
    if(a==='townhall'||t.office==='government')return ['🏛','Government'];
    if(a)return ['🏢',title(a)];
    if(t.shop)return ['🏪',t.shop==='yes'?'Store':title(t.shop)];
    if(t.leisure)return ['🌳',title(t.leisure)];
    if(t.natural==='water'||t.water||t.waterway||t.landuse==='reservoir')return ['💧',t.waterway?title(t.waterway):'Water'];
    if(t.natural==='wood'||t.landuse==='forest')return ['🌲','Woods'];
    if(/^(farmland|farmyard|meadow|orchard)$/.test(t.landuse||''))return ['🌾','Farm'];
    if(t.man_made)return ['🗼',title(t.man_made)];
    if(t.historic)return ['🏛','Historic'];
    if(t.tourism)return ['🏨',title(t.tourism)];
    if(t.railway)return ['🚆',title(t.railway)];
    if(t.aeroway)return ['✈','Airfield'];
    if(t.landuse)return ['📍',title(t.landuse)];

  function arRoadType(h){
    if(/^(motorway|trunk)/.test(h))return 'Highway';

  // ---- OpenStreetMap place data: several servers to try, plus saved copies for offline ----
  const OVERPASS=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://overpass.private.coffee/api/interpreter'];
  let arLastErr='',arLastOk='';
  async function overpass(q,waitMs){
    let last;

      const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),waitMs||45000);
      try{
        const r=await fetch(url,{method:'POST',body:'data='+encodeURIComponent(q),headers:{'Content-Type':'application/x-www-form-urlencoded'},signal:ctl.signal});
        clearTimeout(tm);
        if(!r.ok){last=new Error('server '+r.status);continue}
        const d=await r.json();
        if(d.remark&&/runtime error|timed out|out of memory/i.test(d.remark)&&!(d.elements||[]).length){last=new Error(d.remark);continue}
        arLastOk=new URL(url).hostname+' '+new Date().toLocaleTimeString();arLastErr='';
        return d;
      }catch(e){clearTimeout(tm);last=e;arLastErr=new URL(url).hostname+': '+(e&&(e.name==='AbortError'?'timed out':e.message)||e)}
    }
    throw last||new Error('no server');
  }
  // Tiny IndexedDB key-value store (holds much more than localStorage)
  const idb=(()=>{let dbp=null;
    const open=()=>dbp||(dbp=new Promise((res,rej)=>{const r=indexedDB.open('onpoint',1);
      r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
    const tx=(mode,fn)=>open().then(db=>new Promise((res,rej)=>{const t=db.transaction('kv',mode),st=t.objectStore('kv'),q=fn(st);
      t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)}));
    return {get:k=>tx('readonly',st=>st.get(k)),set:(k,v)=>tx('readwrite',st=>st.put(v,k)),del:k=>tx('readwrite',st=>st.delete(k))};
  })();

  function parsePois(d){
    return (d.elements||[]).map(n=>{const t=n.tags||{};
      const type=t.natural?'peak':t.place?'place':'sight';
      let ele=parseFloat(String(t.ele||'').replace(',','.'));if(!isFinite(ele))ele=null;
      const sub=t.natural?(t.natural==='hill'?'Hill':'Peak'):t.place?t.place[0].toUpperCase()+t.place.slice(1):(t.tourism==='viewpoint'?'Lookout':'Waterfall');
      return {type,name:t.name,sub,lat:n.lat,lng:n.lon,ele,rank:t.place==='city'?0:t.place==='town'?1:t.natural?1:2};
    }).filter(p=>p.name&&typeof p.lat==='number');
  }
  function parseLocal(d){
    const local=[],roads=new Map();
    for(const n of d.elements||[]){
      const t=n.tags||{};
      if(t.highway&&n.geometry){
        const rn=t.name||(t.ref?String(t.ref).split(';')[0].replace(/^(SR|GA)\s*/,'GA ').replace(/^US\s*/,'US '):null);
        if(!rn)continue;
        let rd=roads.get(rn);
        if(!rd){rd={type:'road',name:rn,sub:arRoadType(t.highway)+(t.name&&t.ref?` · ${t.ref}`:''),pts:[]};roads.set(rn,rd)}
        const g=n.geometry;
        for(let i=0;i<g.length;i++){
          if(!g[i])continue;rd.pts.push([+g[i].lat.toFixed(6),+g[i].lon.toFixed(6)]);
          if(i<g.length-1&&g[i+1]){const A={lat:g[i].lat,lng:g[i].lon},B={lat:g[i+1].lat,lng:g[i+1].lon},k=Math.floor(haversine(A,B)/50);
            for(let j=1;j<k;j++)rd.pts.push([+(A.lat+(B.lat-A.lat)*j/k).toFixed(6),+(A.lng+(B.lng-A.lng)*j/k).toFixed(6)])}
        }
        continue;
      }
      const lat=n.lat??(n.center&&n.center.lat),lng=n.lon??(n.center&&n.center.lon);
      if(lat==null||lng==null||t.boundary||t.route||t.admin_level)continue;
      const [icon,sub]=arClassify(t),name=t.name||sub;
      if(local.some(x=>x.name===name&&Math.abs(x.lat-lat)<0.0008&&Math.abs(x.lng-lng)<0.0008))continue;
      local.push({type:'local',name,sub,icon,lat,lng,ele:null,hgt:4,rank:2});
    }

  }
  // Fast queries: search a map box (spatial index) instead of "within X meters of" with tag filters,
  // which made the servers scan the whole planet and time out.
  function bboxOf(lat,lng,m){const dLat=m/111320,dLng=m/(111320*Math.cos(lat*Math.PI/180));
    return [lat-dLat,lng-dLng,lat+dLat,lng+dLng].map(v=>v.toFixed(5)).join(',')}
  const nearQ=(lat,lng,N,t)=>`[out:json][timeout:${t||25}][bbox:${bboxOf(lat,lng,N)}];
(node["name"][!"highway"][!"place"][!"natural"];
 way["name"][!"highway"][!"place"][!"boundary"];
 nwr["power"="substation"];
 nwr["amenity"="place_of_worship"];
);out center 1500;
way["highway"][~"^(name|ref)$"~"."];out geom 900;`;
  const farQ=(lat,lng,R,R2,t)=>{const b1=bboxOf(lat,lng,R),b2=bboxOf(lat,lng,R2);return `[out:json][timeout:${t||25}];
(node["natural"~"^(peak|volcano|hill)$"]["name"](${b1});
 node["place"~"^(city|town)$"]["name"](${b1});
 node["place"~"^(village|hamlet)$"]["name"](${b2});
 node["tourism"="viewpoint"]["name"](${b2});
 node["waterway"="waterfall"]["name"](${b2});
);out body 800;`};
  // Download everything for an area. Two queries, one after the other (servers limit parallel requests).
  async function fetchArea(lat,lng,farMi,nearMi,progress){
    const c=`${lat},${lng}`,R=Math.round(farMi*1609.34),R2=Math.min(R,20000),N=Math.round(nearMi*1609.34);

    progress&&progress('Downloading nearby places & roads…');
    const near=await overpass(nearQ(lat,lng,N,90),100000);
    const {local,roads}=parseLocal(near);
    return {lat,lng,farMi,nearMi,time:Date.now(),pois:parsePois(far),local,roads};
  }
  async function saveArea(area){
    try{
      const idx=(await idb.get('areas'))||[];
      const key=`area:${area.lat.toFixed(3)},${area.lng.toFixed(3)}`;
      await idb.set(key,area);
      const rest=idx.filter(x=>x.key!==key);rest.unshift({key,lat:area.lat,lng:area.lng,nearMi:area.nearMi,farMi:area.farMi,time:area.time,
        counts:[area.pois.length,area.local.length,area.roads.length]});
      for(const old of rest.slice(12))await idb.del(old.key);          // keep the 12 most recent areas
      await idb.set('areas',rest.slice(0,12));
    }catch(e){}
  }
  async function savedAreaFor(pt){
    try{
      const idx=(await idb.get('areas'))||[];
      const hit=idx.map(a=>({a,d:haversine(pt,a)})).filter(x=>x.d<x.a.nearMi*1609.34*0.75).sort((x,y)=>x.d-y.d)[0];

  }
  function useArea(area){

    arFetchedAt={at:{lat:area.lat,lng:area.lng},range:area.farMi,near:area.nearMi};
    arRoadPickAt=0;arDataVer++;
  }
  // Camera labels load in small, quick steps so something shows within seconds:
  //   1) what's right around you (1 mi)  2) towns & peaks  3) the rest out to 3 mi
  // Each step shows its labels as soon as it arrives; a slow or busy server can't stall the rest.
  let arLoading=false,arLoadStart=0;

    const seen=new Set(arLocal.map(x=>x.name+'|'+x.lat.toFixed(4)+'|'+x.lng.toFixed(4)));
    res.local.forEach(x=>{const k=x.name+'|'+x.lat.toFixed(4)+'|'+x.lng.toFixed(4);if(!seen.has(k)){seen.add(k);arLocal.push(x)}});
    const byName=new Map(arRoads.map(r=>[r.name,r]));
    res.roads.forEach(r=>{const pts=r.pts.map(q=>Array.isArray(q)?{lat:q[0],lng:q[1]}:q);
      const ex=byName.get(r.name);if(ex)ex.pts=pts.length>ex.pts.length?pts:ex.pts;else{const n={...r,pts};arRoads.push(n);byName.set(r.name,n)}});

  async function arLoad(force){

    const covered=arFetchedAt&&haversine(me,arFetchedAt.at)<(arFetchedAt.near||2)*1609.34*0.6&&arFetchedAt.range>=arRangeMi;
    if(!force&&covered)return;
    arLoading=true;arLoadStart=Date.now();

  async function arLoadTowers(force){

      for(let i=0;i<shape.pts.length;i++){
        const A=shape.pts[i],B=shape.pts[i+1]||A,Lm=haversine({lat:A[0],lng:A[1]},{lat:B[0],lng:B[1]}),k=Math.max(1,Math.ceil(Lm/step));
        for(let j=0;j<=k;j++){const la=A[0]+(B[0]-A[0])*j/k,lo=A[1]+(B[1]-A[1])*j/k,dLat=wm/111320,dLng=wm/(111320*Math.cos(la*Math.PI/180));
          addBox(la-dLat,lo-dLng,la+dLat,lo+dLng)}
      }
    }else if(shape.kind==='circle'){const r=shape.r*1609.34,dLat=r/111320,dLng=r/(111320*Math.cos(shape.lat*Math.PI/180));addBox(shape.lat-dLat,shape.lng-dLng,shape.lat+dLat,shape.lng+dLng)}
    return set;
  }
  function planShape(shape,layers){
    // Pick the most detail that keeps the download a reasonable size
    // count quickly (boxes by arithmetic, so huge boxes don't freeze the phone)
    const countAt=z=>{
      if(shape.kind==='trail')return tilesForShape(shape,z).size;
      let S,W,N,E;if(shape.kind==='box')[S,W,N,E]=shape.b;
      else{const r=shape.r*1609.34,dLat=r/111320,dLng=r/(111320*Math.cos(shape.lat*Math.PI/180));S=shape.lat-dLat;N=shape.lat+dLat;W=shape.lng-dLng;E=shape.lng+dLng}
      return (TX(E,z)-TX(W,z)+1)*(TY(S,z)-TY(N,z)+1);
    };
    let zmax=16,count=0;
    for(;zmax>=10;zmax--){count=0;for(let z=8;z<=zmax;z++){count+=countAt(z);if(count>9000)break}if(count<=9000)break}
    const kb=layers.reduce((a,k)=>a+DL_LAYERS[k].kb,0);
    return {zmax,count:count*layers.length,mb:Math.max(1,Math.round(count*kb/1024))};
  }
  function shapeUrls(shape,layers,zmax){
    const out=[];
    for(const k of layers)for(let z=8;z<=zmax;z++)for(const key of tilesForShape(shape,z)){const[zz,x,y]=key.split('/');out.push({u:tileUrl(DL_LAYERS[k].path,+zz,+x,+y),k})}
    return out;
  }
  function shapeOf(d){
    if(d.kind)return d;
    return {kind:'circle',lat:d.lat,lng:d.lng,r:d.r};    // downloads from the older version
  }

  // ---- showing downloads on the map ----
  const dlLayer=L.layerGroup().addTo(map),dlTiles=L.layerGroup().addTo(map),dlEdit=L.layerGroup().addTo(map),dlCanvas=L.canvas({padding:.3});
  let dlRunning=false;
  const mPerPx=()=>40075016*Math.cos(map.getCenter().lat*Math.PI/180)/2**(map.getZoom()+8);
  function drawShape(shape,style,layer){
    if(shape.kind==='box'){const[s,w,n,e]=shape.b;return L.rectangle([[s,w],[n,e]],style).addTo(layer)}
    if(shape.kind==='circle'){const r=shape.r*1609.34,dLat=r/111320,dLng=r/(111320*Math.cos(shape.lat*Math.PI/180));
      return L.rectangle([[shape.lat-dLat,shape.lng-dLng],[shape.lat+dLat,shape.lng+dLng]],style).addTo(layer)}
    if(shape.kind==='trail'&&shape.pts.length){
      const band=L.polyline(shape.pts,{...style,weight:Math.max(6,2*shape.w*1609.34/mPerPx()),opacity:.25,lineCap:'round',lineJoin:'round'}).addTo(layer);
      band._band=shape.w;
      L.polyline(shape.pts,{...style,fill:false,weight:3,opacity:.9}).addTo(layer);
      return band;
    }
  }
  map.on('zoomend',()=>{[dlLayer,dlEdit].forEach(g=>g.eachLayer(l=>{if(l._band)l.setStyle({weight:Math.max(6,2*l._band*1609.34/mPerPx())})}))});
  function drawDownloadAreas(list){
    dlLayer.clearLayers();
    (list||[]).forEach(d=>drawShape(shapeOf(d),{color:'#2E9E5B',weight:2,fillOpacity:.06,interactive:false},dlLayer));
  }
  function clearDownloadAreas(){if(!dlRunning){dlLayer.clearLayers();dlTiles.clearLayers()}}

  // ---- choosing the area by hand ----
  let dlSelecting=false,dlMode='box',dlBox=null,dlTrail=[],dlW=0.25,dlMaps={usgs:true,usgsimg:false},dlEstT=null;
  const handleIcon=L.divIcon({className:'',html:'<div class="dl-h"></div>',iconSize:[26,26],iconAnchor:[13,13]});
  const moveIcon=L.divIcon({className:'',html:'<div class="dl-mv">✥</div>',iconSize:[40,40],iconAnchor:[20,20]});
  const ptIcon=L.divIcon({className:'',html:'<div class="dl-pt"></div>',iconSize:[14,14],iconAnchor:[7,7]});
  function curShape(){return dlMode==='box'?{kind:'box',b:dlBox}:{kind:'trail',pts:dlTrail,w:dlW}}
  function curLayers(){return Object.keys(DL_LAYERS).filter(k=>dlMaps[k])}
  async function startSelect(){
    dlSelecting=true;follow=false;$('locBtn').classList.remove('on');
    if(headingOn){stopHeading();map.setBearing(0)}else if(canRotate&&Math.abs(map.getBearing())>1)map.setBearing(0);
    const b=map.getBounds(),dy=(b.getNorth()-b.getSouth()),dx=(b.getEast()-b.getWest());
    // start with a box in the upper-middle of the screen (the panel covers the bottom)
    dlBox=[b.getSouth()+dy*.45,b.getWest()+dx*.15,b.getNorth()-dy*.2,b.getEast()-dx*.15];
    $('dlpanel').classList.add('show');document.querySelector('.dock').style.display='none';document.querySelector('.fab-col').style.display='none';
    drawDownloadAreas((await idb.get('downloads').catch(()=>null))||[]);
    setMode(dlMode);
  }
  function endSelect(){
    dlSelecting=false;dlEdit.clearLayers();
    $('dlpanel').classList.remove('show');document.querySelector('.dock').style.display='';document.querySelector('.fab-col').style.display='';
    clearDownloadAreas();
  }
  function setMode(m){
    dlMode=m;
    $('dlpMode').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===m));
    $('dlpWidth').style.display=$('dlpTrailBtns').style.display=m==='trail'?'flex':'none';
    $('dlpHint').innerHTML=m==='box'
      ?'Drag the <b>white corners</b> to size the box, and the <b>pink ✥</b> to move it. Stretch it long and thin for a trail, or zoom out for a big area.'
      :'Tap along the trail or road, point by point. The band shows what gets saved on each side.';
    redrawEdit();
  }
  function redrawEdit(){
    dlEdit.clearLayers();
    const style={color:'#E0287D',weight:3,dashArray:'8 6',fillColor:'#E0287D',fillOpacity:.1,interactive:false};
    if(dlMode==='box'){
      let[s,w,n,e]=dlBox;
      const rect=L.rectangle([[s,w],[n,e]],style).addTo(dlEdit);
      const corners={sw:[s,w],nw:[n,w],ne:[n,e],se:[s,e]},hs={};
      const refresh=()=>{[s,w,n,e]=dlBox;rect.setBounds([[s,w],[n,e]]);
        const c={sw:[s,w],nw:[n,w],ne:[n,e],se:[s,e]};for(const k in hs)if(!hs[k]._drag)hs[k].setLatLng(c[k]);
        if(!mv._drag)mv.setLatLng([(s+n)/2,(w+e)/2]);estimate()};
      for(const k in corners){
        const h=L.marker(corners[k],{icon:handleIcon,draggable:true,zIndexOffset:2000}).addTo(dlEdit);hs[k]=h;
        h.on('dragstart',()=>h._drag=true);
        h.on('drag',()=>{const p=h.getLatLng();let[s2,w2,n2,e2]=dlBox;
          if(k[0]==='s')s2=p.lat;else n2=p.lat;if(k[1]==='w')w2=p.lng;else e2=p.lng;
          dlBox=[Math.min(s2,n2),Math.min(w2,e2),Math.max(s2,n2),Math.max(w2,e2)];refresh()});
        h.on('dragend',()=>{h._drag=false;refresh()});
      }
      const mv=L.marker([(s+n)/2,(w+e)/2],{icon:moveIcon,draggable:true,zIndexOffset:2100}).addTo(dlEdit);let start=null;
      mv.on('dragstart',()=>{mv._drag=true;start={p:mv.getLatLng(),b:dlBox.slice()}});
      mv.on('drag',()=>{const p=mv.getLatLng(),dl=p.lat-start.p.lat,dn=p.lng-start.p.lng;
        dlBox=[start.b[0]+dl,start.b[1]+dn,start.b[2]+dl,start.b[3]+dn];refresh()});
      mv.on('dragend',()=>{mv._drag=false;refresh()});
    }else{
      if(dlTrail.length)drawShape({kind:'trail',pts:dlTrail,w:dlW},{color:'#E0287D',interactive:false},dlEdit);
      dlTrail.forEach(p=>L.marker(p,{icon:ptIcon,interactive:false}).addTo(dlEdit));
    }
    estimate();
  }
  function estimate(){
    clearTimeout(dlEstT);
    dlEstT=setTimeout(()=>{
      const layers=curLayers(),el=$('dlpEst');
      if(!layers.length){el.textContent='Pick at least one map';return}
      if(dlMode==='trail'&&dlTrail.length<2){el.textContent='Tap at least 2 points along the trail';return}
      const sh=curShape(),pl=planShape(sh,layers);
      let size='';
      if(sh.kind==='box'){const[s,w,n,e]=sh.b;const hMi=haversine({lat:s,lng:w},{lat:n,lng:w})/1609.34,wMi=haversine({lat:s,lng:w},{lat:s,lng:e})/1609.34;size=`${wMi.toFixed(1)} × ${hMi.toFixed(1)} mi · `}
      else{let L=0;for(let i=1;i<dlTrail.length;i++)L+=haversine({lat:dlTrail[i-1][0],lng:dlTrail[i-1][1]},{lat:dlTrail[i][0],lng:dlTrail[i][1]});size=`${(L/1609.34).toFixed(1)} mi long · `}
      el.textContent=`${size}~${pl.mb} MB${pl.zmax<16?' · less close-up detail (big area)':''}`;
    },120);
  }
  $('dlpMode').onclick=e=>{const b=e.target.closest('[data-m]');if(b)setMode(b.dataset.m)};
  $('dlpWidth').onclick=e=>{const b=e.target.closest('[data-w]');if(!b)return;dlW=+b.dataset.w;
    $('dlpWidth').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));redrawEdit()};
  $('dlpMaps').onclick=e=>{const b=e.target.closest('[data-l]');if(!b)return;dlMaps[b.dataset.l]=!dlMaps[b.dataset.l];b.setAttribute('aria-pressed',dlMaps[b.dataset.l]);estimate()};
  $('dlpUndo').onclick=()=>{dlTrail.pop();redrawEdit()};
  $('dlpClear').onclick=()=>{dlTrail=[];redrawEdit()};
  $('dlpCancel').onclick=endSelect;
  $('dlpGo').onclick=()=>{
    const layers=curLayers();if(!layers.length){toast('Pick at least one map');return}
    if(dlMode==='trail'&&dlTrail.length<2){toast('Tap at least 2 points along the trail');return}
    const shape=JSON.parse(JSON.stringify(curShape()));endSelect();runDownload(shape,layers);
  };

  // ---- downloading ----
  async function runDownload(shape,layers){
    if(!navigator.onLine){toast('You need signal to download');return}
    if(!('caches' in window)){toast('This browser can’t store maps offline');return}
    try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
    const pl=planShape(shape,layers),jobs=shapeUrls(shape,layers,pl.zmax);
    dlCancel=false;dlRunning=true;
    drawDownloadAreas((await idb.get('downloads').catch(()=>null))||[]);
    const outline=drawShape(shape,{color:'#E0287D',weight:3,dashArray:'8 6',fillOpacity:.06,interactive:false},dlLayer);
    try{map.fitBounds(outline.getBounds(),{paddingTopLeft:[20,150],paddingBottomRight:[20,100]})}catch(e){}
    const bn=$('dlbanner');bn.classList.add('show');
    $('dlbStop').onclick=()=>{dlCancel=true;$('dlbT').textContent='Stopping…'};
    const cache=await caches.open(OFF_CACHE);let done=0,fail=0,i=0,corsBroke=false;
    const showZ=Math.max(8,pl.zmax-2),lit=new Set();
    const upd=j=>{const pct=Math.round(done/jobs.length*100);$('dlbBar').style.width=Math.min(95,pct)+'%';
      const m=j&&j.u.match(/tile\/(\d+)\/(\d+)\/(\d+)$/);
      $('dlbT').textContent=`Downloading ${j?DL_LAYERS[j.k].name:''} — ${pct}%`;
      $('dlbS').textContent=` · detail level ${m?m[1]:''} of ${pl.zmax} · ${done.toLocaleString()} / ${jobs.length.toLocaleString()} pieces${fail?` · ${fail} missed`:''}`};
    const light=(j,ok)=>{const m=j.u.match(/tile\/(\d+)\/(\d+)\/(\d+)$/);if(!m)return;
      let z=+m[1],y=+m[2],x=+m[3];if(z<showZ)return;while(z>showZ){x>>=1;y>>=1;z--}
      const key=`${j.k}/${z}/${x}/${y}`+(ok?'':'!');if(lit.has(key))return;lit.add(key);
      L.rectangle(tileBounds(z,x,y),{renderer:dlCanvas,weight:.5,color:ok?'#E0287D':'#B3261E',fillColor:ok?'#E0287D':'#B3261E',fillOpacity:ok?.18:.4,interactive:false}).addTo(dlTiles)};
    async function worker(){
      while(i<jobs.length&&!dlCancel){
        const j=jobs[i++];let ok=true;
        try{if(!(await cache.match(j.u))){let r;
            try{r=await fetch(j.u,{mode:usgsCors?'cors':'no-cors'})}
            catch(e){if(usgsCors){corsBroke=true;r=await fetch(j.u,{mode:'no-cors'})}else throw e}
            if(r.ok||r.type==='opaque')await cache.put(j.u,r);else{fail++;ok=false}}
        }catch(e){fail++;ok=false}
        done++;light(j,ok);if(done%5===0||done===jobs.length)upd(j);
      }
    }
    upd(jobs[0]);
    await Promise.all(Array.from({length:6},worker));
    if(corsBroke){try{localStorage.setItem('onpoint.usgsCors','0')}catch(e){}}
    if(dlCancel){bn.classList.remove('show');dlRunning=false;setTimeout(()=>{dlTiles.clearLayers();dlLayer.clearLayers()},1500);toast('Download cancelled — what finished is kept');return}
    // Named places & roads for the camera view: a few spots spread over the shape
    $('dlbT').textContent='Downloading named places & roads…';$('dlbS').textContent='';$('dlbBar').style.width='96%';
    let spots=[],near=3;
    const ob=outline.getBounds(),c=ob.getCenter();
    if(shape.kind==='trail'){
      const pts=shape.pts.map(p=>({lat:p[0],lng:p[1]}));let total=0;const cum=[0];
      for(let k=1;k<pts.length;k++){total+=haversine(pts[k-1],pts[k]);cum.push(total)}
      const n=Math.min(5,Math.max(1,Math.ceil(total/(6*1609.34))));
      for(let q=0;q<n;q++){const t=(q+.5)/n*total;let k=1;while(k<cum.length-1&&cum[k]<t)k++;
        const f=(t-cum[k-1])/((cum[k]-cum[k-1])||1);spots.push({lat:pts[k-1].lat+(pts[k].lat-pts[k-1].lat)*f,lng:pts[k-1].lng+(pts[k].lng-pts[k-1].lng)*f})}
      near=Math.min(3,Math.max(1,total/1609.34/n/2+shape.w));
    }else{
      spots=[{lat:c.lat,lng:c.lng}];
      near=Math.min(3,Math.max(1,haversine(c,ob.getNorthEast())/1609.34));
    }
    let placesOk=0,placeCount=0,roadCount=0,firstArea=null;
    for(const sp of spots){
      try{const area=await fetchArea(sp.lat,sp.lng,30,near,x=>{$('dlbS').textContent=` · ${x}`});await saveArea(area);
        placesOk++;placeCount+=area.local.length;roadCount+=area.roads.length;firstArea=firstArea||area}catch(e){}
    }
    $('dlbBar').style.width='100%';
    const list=(await idb.get('downloads').catch(()=>null))||[];
    const name=await nameFor(c,firstArea);
    const id='dl'+Date.now().toString(36);
    await idb.set('dl:'+id,jobs.map(j=>j.u)).catch(()=>{});
    list.unshift({id,name,...shape,zmax:pl.zmax,layers,time:Date.now()});
    await idb.set('downloads',list).catch(()=>{});
    bn.classList.remove('show');dlRunning=false;
    drawDownloadAreas(list);setTimeout(()=>dlTiles.clearLayers(),2500);
    openSheet(`<h2 id="sheetTitle">Area downloaded ✓</h2>
      <p class="fine" style="font-size:15px">${esc(name)} · ${(jobs.length-fail).toLocaleString()} map pieces${placesOk?` · ${placeCount} places · ${roadCount} roads`:''}</p>
      ${fail?`<p class="fine">${fail} pieces didn't download (server busy — shown in red). Download the same area again later to fill the gaps; finished pieces are skipped.</p>`:''}
      ${placesOk<spots.length?'<p class="fine">Some named places didn’t download (server busy). The map part is saved.</p>':''}
      ${corsBroke?'<p class="fine">Close and reopen the app once so the downloaded map shows up.</p>':''}
      <div class="row"><button class="b-primary" id="dlShow">Use downloaded map</button></div>`);
    onSheetClose=()=>clearDownloadAreas();
    $('dlShow').onclick=()=>{layerState.base=layers[0];applyLayers();closeSheet()};
  }
  let dlCancel=false;
  async function nameFor(c,area){
    if(area&&area.pois&&area.pois.length){
      const p=area.pois.filter(p=>p.type==='place').map(p=>({p,d:haversine(c,p)})).sort((a,b)=>a.d-b.d)[0];
      if(p)return (p.d<3000?'':'Near ')+p.p.name;
    }
    return `${c.lat.toFixed(3)}, ${c.lng.toFixed(3)}`;
  }
  async function urlsOf(d){
    if(d.id){const u=await idb.get('dl:'+d.id).catch(()=>null);if(u)return u}
    return shapeUrls(shapeOf(d),d.layers,d.zmax).map(j=>j.u);
  }
  async function showDownloads(){
    const list=(await idb.get('downloads').catch(()=>null))||[];
    drawDownloadAreas(list);
    if(list.length){const g=L.featureGroup(dlLayer.getLayers());try{map.fitBounds(g.getBounds(),{paddingTopLeft:[20,90],paddingBottomRight:[20,Math.round(innerHeight*.55)]})}catch(e){}}
    const rows=list.map((d,i)=>`<div class="opt" style="cursor:default"><span><span class="ot">${esc(d.name)}</span><span class="od">${d.kind==='trail'?'Trail':'Area'} · ${d.layers.map(k=>DL_LAYERS[k].name).join(' + ')} · ${new Date(d.time).toLocaleDateString()}</span></span>
      <button class="b-danger" data-del="${i}" style="margin-left:auto;border-radius:10px;padding:8px 12px;font-weight:600">Delete</button></div>`).join('');
    openSheet(`<h2 id="sheetTitle">Downloads</h2>
      ${list.length?`<p class="fine" style="margin-top:4px">Green on the map = saved for offline.</p>${rows}`:'<p class="fine">Nothing downloaded yet.</p>'}
      <div class="row"><button class="b-ghost" id="dmClose">Close</button><button class="b-flag" id="dmNew">⬇ Download another</button></div>`);
    onSheetClose=()=>clearDownloadAreas();
    $('dmClose').onclick=closeSheet;
    $('dmNew').onclick=()=>{onSheetClose=null;closeSheet();startSelect()};
    $('sheetBody').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>deleteDownload(+b.dataset.del));
  }
  async function deleteDownload(i){
    const list=(await idb.get('downloads').catch(()=>null))||[];const d=list[i];if(!d)return;
    if(!confirm(`Delete the download for ${d.name}?`))return;
    const cache=await caches.open(OFF_CACHE);
    const keep=new Set();for(let j=0;j<list.length;j++)if(j!==i)(await urlsOf(list[j])).forEach(u=>keep.add(u));
    for(const u of await urlsOf(d))if(!keep.has(u))await cache.delete(u);
    if(d.id)await idb.del('dl:'+d.id).catch(()=>{});
    list.splice(i,1);await idb.set('downloads',list).catch(()=>{});
    toast('Download deleted');onSheetClose=null;showDownloads();
  }
  // Lost signal: switch to a downloaded map if you're looking at one that isn't saved
  window.addEventListener('offline',async()=>{
    const list=(await idb.get('downloads').catch(()=>null))||[];
    if(list.length&&!DL_LAYERS[layerState.base]){layerState.base=list[0].layers[0];applyLayers();toast('No signal — switched to your downloaded map')}
  });

  async function saveAreaNow(){
    if(!me){toast('Waiting for your location…');return}
    if(!navigator.onLine){toast('You need signal to download an area');return}
    openSheet(`<h2 id="sheetTitle">Saving this area</h2><p class="fine" id="savePr" style="font-size:15px">Starting…</p>
      <p class="fine">Keep the app open. This can take up to a minute.</p>`);
    const pr=t=>{const el=$('savePr');if(el)el.textContent=t};
    try{
      const area=await fetchArea(me.lat,me.lng,30,3,pr);
      await saveArea(area);useArea(area);
      pr('Saving cell towers…');await arLoadTowers(true);
      openSheet(`<h2 id="sheetTitle">Area saved ✓</h2>
        <p class="fine" style="font-size:15px">${area.pois.length} towns & peaks · ${area.local.length} nearby places · ${area.roads.length} roads</p>
        <p class="fine">The camera view will use this with no signal. For the map itself, pan and zoom around here now — every map tile you see gets kept for offline too.</p>
        <div class="row"><button class="b-primary" id="svDone">Done</button></div>`);
      $('svDone').onclick=closeSheet;
    }catch(e){pr('Download failed ('+(e&&e.message||'error')+'). The map servers may be busy — try again in a minute.')}
  }
  // Offline app: a small service worker (sw.js, uploaded next to index.html) keeps the app
  // and every map tile you've viewed on the phone.
  if('serviceWorker' in navigator&&location.protocol==='https:'){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
  window.addEventListener('offline',()=>toast('No signal — using saved map & places'));
  window.addEventListener('online',()=>toast('Back online'));

  // ---------- actions ----------
  map.on('click',e=>{ if(dlSelecting){if(dlMode==='trail'){dlTrail.push([+e.latlng.lat.toFixed(6),+e.latlng.lng.toFixed(6)]);redrawEdit()}return}
    if($('sheet').classList.contains('show')){closeSheet();return} $('hint').style.opacity=0; newPinAt(e.latlng.lat,e.latlng.lng); });
  $('pinHereBtn').onclick=()=>{ if(!me){toast('No GPS fix yet — tap the map to pin a spot instead');return} newPinAt(me.lat,me.lng); };
  $('listBtn').onclick=showList;
})();
</script>
</body>
