<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#24313B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="On Point">
<title>On Point</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📍</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Leaflet core (inlined) */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;touch-action:none;-webkit-tap-highlight-color:transparent;outline-offset:1px}
.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow{user-select:none;-webkit-user-drag:none}
.leaflet-container img.leaflet-tile,.leaflet-container .leaflet-marker-pane img{max-width:none!important;max-height:none!important}
.leaflet-tile{visibility:hidden}.leaflet-tile-loaded{visibility:inherit}
.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-shadow-pane{z-index:500}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}
.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-zoom-anim .leaflet-tile,.leaflet-pan-anim .leaflet-tile{transition:none}
.leaflet-zoom-anim .leaflet-zoom-hide{visibility:hidden}
.leaflet-interactive{cursor:pointer}.leaflet-grab{cursor:grab}.leaflet-dragging .leaflet-grab{cursor:move}
.leaflet-pane>svg path{pointer-events:none}.leaflet-pane>svg path.leaflet-interactive,.leaflet-marker-icon.leaflet-interactive{pointer-events:auto}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}
.leaflet-control{position:relative;z-index:800;float:left;clear:both;pointer-events:auto}.leaflet-right .leaflet-control{float:right}
.leaflet-control-attribution{background:rgba(255,255,255,.8);margin:0;padding:0 5px;color:#333;line-height:1.4}
.leaflet-div-icon{background:none;border:0}
:root{
  --slate:#24313B; --slate-2:#34444F; --paper:#FAFAF7; --ink:#1C252C;
  --muted:#6B7A85; --line:#DCE0E2; --flag:#E0287D; --you:#1E7FD8;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--slate);overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--you);outline-offset:2px}

#map{position:absolute;inset:0;background:#DDE3E6}

/* Top bar */
.top{position:absolute;left:0;right:0;top:0;z-index:500;padding:calc(var(--safe-t) + 10px) 12px 10px;display:flex;align-items:center;gap:10px;background:var(--slate);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.brand{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:26px;letter-spacing:.5px;line-height:1;display:flex;align-items:center;gap:8px}
.brand svg{width:20px;height:26px}
.readout{margin-left:auto;text-align:right;font-size:13px;line-height:1.25;color:#C9D3DA;font-variant-numeric:tabular-nums}
.readout b{color:#fff;font-weight:600}
.icon-btn{border:0;background:var(--slate-2);color:#fff;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none}
.icon-btn svg{width:22px;height:22px}

/* Floating controls */
.fab-col{position:absolute;right:12px;bottom:calc(var(--safe-b) + 84px);z-index:500;display:flex;flex-direction:column;gap:10px}
.fab{width:52px;height:52px;border-radius:14px;border:0;background:var(--paper);color:var(--ink);box-shadow:0 3px 10px rgba(0,0,0,.25);display:grid;place-items:center}
.fab svg{width:26px;height:26px}
.fab.on{color:var(--you)}
.dock{position:absolute;left:12px;right:12px;bottom:calc(var(--safe-b) + 14px);z-index:500;display:flex;gap:10px}
.dock button{flex:1;height:54px;border:0;border-radius:14px;font-weight:600;font-size:17px;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.btn-flag{background:var(--flag);color:#fff}
.btn-plain{background:var(--paper);color:var(--ink)}
.hint{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--safe-t) + 72px);z-index:500;background:rgba(36,49,59,.92);color:#fff;padding:8px 14px;border-radius:20px;font-size:14px;white-space:nowrap;pointer-events:none;transition:opacity .4s}

/* Sheet */
.scrim{position:absolute;inset:0;z-index:900;background:rgba(20,28,34,.35);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:1000;background:var(--paper);border-radius:18px 18px 0 0;padding:8px 18px calc(var(--safe-b) + 18px);max-height:78%;overflow-y:auto;transform:translateY(105%);transition:transform .25s ease;box-shadow:0 -4px 20px rgba(0,0,0,.2)}
.sheet.show{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sheet h2{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:28px;margin:0 0 2px;line-height:1.1}
.coords{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;margin-bottom:14px}
label.f{display:block;font-weight:600;font-size:15px;margin:12px 0 6px}
input[type=text],textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;font-size:17px}
textarea{min-height:96px;resize:vertical;line-height:1.45}
input[type=text]:focus,textarea:focus{border-color:var(--slate);outline:none}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6)}
.sw[aria-pressed=true]{border-color:var(--ink)}
.row{display:flex;gap:10px;margin-top:18px}
.row button{flex:1;height:50px;border-radius:12px;border:0;font-weight:600;font-size:16px}
.b-primary{background:var(--slate);color:#fff}
.b-flag{background:var(--flag);color:#fff}
.b-ghost{background:#EEF0F1;color:var(--ink)}
.b-danger{background:#fff;color:#B3261E;border:1.5px solid #E6C3C0 !important}
.note-body{font-size:17px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word;margin:6px 0 4px}
.note-empty{color:var(--muted);font-style:italic}
.meta{font-size:14px;color:var(--muted);margin-top:10px}
.dist{display:inline-block;background:#EEF0F1;border-radius:8px;padding:3px 9px;font-weight:600;color:var(--ink);font-size:14px;margin-right:6px}

/* List */
.list{list-style:none;margin:6px 0 0;padding:0}
.list li button{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:13px 2px;display:flex;align-items:center;gap:12px}
.list .dot{width:14px;height:14px;border-radius:50%;flex:none}
.list .t{font-weight:600;font-size:17px;display:block}
.list .s{font-size:14px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:62vw}
.list .d{margin-left:auto;font-size:14px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{padding:22px 0 8px;color:var(--muted);font-size:16px;line-height:1.5}
.tools{display:flex;gap:10px;margin-top:16px}
.tools button{flex:1;height:44px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:600}

/* Toast */
.toast{position:absolute;left:50%;bottom:calc(var(--safe-b) + 84px);transform:translate(-50%,20px);z-index:1200;background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:15px;opacity:0;pointer-events:none;transition:all .25s;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Markers */
.you-dot{width:18px;height:18px;border-radius:50%;background:var(--you);border:3px solid #fff;box-shadow:0 0 0 2px rgba(30,127,216,.35),0 1px 4px rgba(0,0,0,.4)}
.you{position:relative;width:110px;height:110px;pointer-events:none}
.you .you-dot{position:absolute;left:46px;top:46px}
.you .arrow{position:absolute;left:39px;top:39px;width:32px;height:32px;display:none;transition:transform .2s linear;filter:drop-shadow(0 1px 3px rgba(0,0,0,.45))}
.you.moving .arrow{display:block}.you.moving .you-dot{display:none}
.you .cone{position:absolute;left:0;top:0;width:110px;height:110px;display:none;transition:transform .12s linear}
.you .cone.on{display:block}
.tower-ic svg{display:block;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.45))}
.flag-pin svg{display:block;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.leaflet-control-attribution{font-size:10px}
.leaflet-top{top:calc(var(--safe-t) + 62px)}
/* Layers sheet */
.sec{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:18px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.opt{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px}
.opt[aria-pressed=true],.opt[aria-checked=true]{border-color:var(--slate);box-shadow:inset 0 0 0 1px var(--slate)}
.opt .ot{font-weight:600;font-size:16px;display:block}
.opt .od{font-size:13.5px;color:var(--muted);display:block;line-height:1.35}
.opt .mk{margin-left:auto;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.opt[aria-pressed=true] .mk,.opt[aria-checked=true] .mk{background:var(--slate);border-color:var(--slate)}
.opt[aria-pressed=true] .mk::after,.opt[aria-checked=true] .mk::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
.opt.sw-t .mk{border-radius:7px}
.fine{font-size:13px;color:var(--muted);line-height:1.45;margin-top:10px}
/* Compass */
#needle{transition:transform .15s linear}
.fab.head{background:var(--slate);color:#fff}
/* Legend */
.legend{position:absolute;left:12px;bottom:calc(var(--safe-b) + 84px);z-index:500;background:rgba(250,250,247,.95);border-radius:10px;padding:7px 10px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.2);width:170px;display:none}
.legend.show{display:block}
.legend .bar{height:10px;border-radius:5px;background:linear-gradient(90deg,#2b0f6b,#1f4bd1,#1fb3d9,#3fcf7a,#e8e23a,#f08a24,#c81e1e);margin:4px 0 2px}
.legend .ends{display:flex;justify-content:space-between;color:var(--muted)}
/* Pin water data */
.two{display:flex;gap:10px}.two>div{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 4px}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div id="map" role="application" aria-label="Map"></div>

<header class="top">
  <div class="brand">
    <svg viewBox="0 0 20 26" aria-hidden="true"><path d="M3 1v24" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/><path d="M4 2h13l-3.5 5L17 12H4z" fill="#E0287D"/></svg>
    On Point
  </div>
  <div class="readout" id="readout" aria-live="polite">Finding you…</div>
  <button class="icon-btn" id="layerBtn" aria-label="Map layers" title="Map layers">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3 2 8l10 5 10-5z"/><path d="m2 13 10 5 10-5"/></svg>
  </button>
</header>

<div class="hint" id="hint">Tap the map to drop a pin</div>

<div class="legend" id="legend" aria-hidden="true"><b id="legendTitle">Water temp</b><div class="bar"></div><div class="ends"><span>Colder</span><span>Warmer</span></div></div>

<div class="fab-col">
  <button class="fab" id="compassBtn" aria-label="Compass: tap to point north, tap again to follow your heading" title="Compass">
    <svg viewBox="0 0 24 24" aria-hidden="true"><g id="needle" style="transform-origin:12px 12px"><path d="M12 2.5 15 12H9z" fill="#E0287D"/><path d="M12 21.5 9 12h6z" fill="currentColor" opacity=".55"/></g><circle cx="12" cy="12" r="1.6" fill="#fff"/></svg>
  </button>
  <button class="fab" id="locBtn" aria-label="Center on my location" title="Center on me">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></svg>
  </button>
</div>

<nav class="dock">
  <button class="btn-plain" id="listBtn">Pins (<span id="count">0</span>)</button>
  <button class="btn-flag" id="pinHereBtn">Pin where I am</button>
</nav>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="grab"></div>
  <div id="sheetBody"></div>
</section>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet-rotate@0.2.7/dist/leaflet-rotate-src.js"></script>
<script>
(function(){
  const KEY='onpoint.pins.v1';
  const COLORS=['#E0287D','#F28C28','#2E9E5B','#1E7FD8','#7B4FD1','#24313B'];
  const $=id=>document.getElementById(id);
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // ---------- storage ----------
  function load(){try{const v=JSON.parse(localStorage.getItem(KEY));return Array.isArray(v)?v:[]}catch(e){return[]}}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(pins))}catch(e){toast('Could not save — storage is full or blocked')}}
  let pins=load();

  // ---------- map ----------
  const map=L.map('map',{zoomControl:false,attributionControl:true,rotate:true,touchRotate:true,rotateControl:false,bearing:0}).setView([33.75,-84.39],12);
  const canRotate=typeof map.setBearing==='function';

  // NOAA nautical charts come from an Esri export endpoint, so build a tile URL from each tile's box
  const EsriExport=L.TileLayer.extend({
    getTileUrl(c){
      const b=this._tileCoordsToBounds(c),P=L.CRS.EPSG3857;
      const nw=P.project(b.getNorthWest()),se=P.project(b.getSouthEast());
      return this._url+'?bbox='+[nw.x,se.y,se.x,nw.y].join(',')+'&bboxSR=3857&imageSR=3857&size=256,256&format=png32&transparent=true&f=image';
    }
  });
  const gibs=name=>`https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/${name}/default/default/GoogleMapsCompatible_Level7/{z}/{y}/{x}.png`;

  const BASES={
    street:{name:'Street',desc:'Roads, trails and place names',layer:L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,maxNativeZoom:19,attribution:'© OpenStreetMap'})},
    sat:{name:'Satellite',desc:'Aerial photos',layer:L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:20,maxNativeZoom:17,attribution:'Imagery © Esri'})},
    topo:{name:'Topo',desc:'Terrain contour lines, shorelines and creeks',layer:L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{maxZoom:20,maxNativeZoom:17,attribution:'© OpenTopoMap, OpenStreetMap'})},
    ocean:{name:'Ocean depth',desc:'Sea-floor shading by depth, offshore and along the coast',layer:L.layerGroup([
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Base/MapServer/tile/{z}/{y}/{x}',{maxZoom:20,maxNativeZoom:13,attribution:'Ocean © Esri, GEBCO, NOAA'}),
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Reference/MapServer/tile/{z}/{y}/{x}',{maxZoom:20,maxNativeZoom:13})])}
  };
  // Cell towers: FCC licensing data via HIFLD, fetched for whatever area is on screen
  const TOWER_URL='https://services2.arcgis.com/FiaPA4ga0iQKduv3/arcgis/rest/services/Cellular_Towers_in_the_United_States/FeatureServer/0/query';
  const towers=L.layerGroup();
  const towerIcon=L.divIcon({className:'tower-ic',iconSize:[22,26],iconAnchor:[11,25],
    html:'<svg width="22" height="26" viewBox="0 0 22 26"><path d="M11 6 6 25M11 6l5 19M7.6 18h6.8M8.9 12.5h4.2" stroke="#24313B" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="11" cy="5" r="2.6" fill="#F28C28" stroke="#fff" stroke-width="1"/><path d="M5 1.5a8 8 0 0 0 0 7M17 1.5a8 8 0 0 1 0 7" stroke="#F28C28" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>'});
  let towerSeq=0,towerTimer=null,towerWarned=false;
  const towerCache=new Map();
  async function loadTowers(){
    if(!map.hasLayer(towers))return;
    if(map.getZoom()<11){towers.clearLayers();if(!towerWarned){toast('Zoom in closer to see cell towers');towerWarned=true}return}
    towerWarned=false;
    const b=map.getBounds().pad(0.15),seq=++towerSeq;
    const q=new URLSearchParams({where:'1=1',geometry:[b.getWest(),b.getSouth(),b.getEast(),b.getNorth()].join(','),
      geometryType:'esriGeometryEnvelope',inSR:'4326',spatialRel:'esriSpatialRelIntersects',outFields:'*',outSR:'4326',
      returnGeometry:'true',resultRecordCount:'500',f:'json'});
    try{
      const r=await fetch(TOWER_URL+'?'+q);const d=await r.json();
      if(seq!==towerSeq||!map.hasLayer(towers))return;
      if(d.error)throw new Error(d.error.message);
      towers.clearLayers();
      (d.features||[]).forEach(f=>{
        if(!f.geometry)return;
        const t={lat:f.geometry.y,lng:f.geometry.x,a:f.attributes||{}};
        const id='t'+t.lat.toFixed(5)+t.lng.toFixed(5);towerCache.set(id,t);
        L.marker([t.lat,t.lng],{icon:towerIcon,title:'Cell tower'}).on('click',()=>showTower(id)).addTo(towers);
      });
      if(!(d.features||[]).length)toast('No listed towers in this area');
    }catch(e){if(seq===towerSeq)toast('Couldn’t load cell towers right now')}
  }
  towers.on('add',loadTowers);
  map.on('moveend',()=>{clearTimeout(towerTimer);towerTimer=setTimeout(loadTowers,350)});
  function pick(a,re){const k=Object.keys(a).find(k=>re.test(k)&&a[k]!==null&&a[k]!==''&&a[k]!==' ');return k?a[k]:null}
  function showTower(id){
    const t=towerCache.get(id);if(!t)return;const a=t.a;
    const owner=pick(a,/licens|owner|entity|company/i),call=pick(a,/call/i),
      h=pick(a,/struc.*h|height|hgt|agl/i),city=pick(a,/city/i),st=pick(a,/^(loc)?state$|locstate/i);
    const skip=/objectid|fid|shape|globalid|^x$|^y$|lat|lon/i;
    const extra=Object.entries(a).filter(([k,v])=>v!==null&&v!==''&&v!==' '&&!skip.test(k)).slice(0,14)
      .map(([k,v])=>`<div><b>${esc(k)}:</b> ${esc(v)}</div>`).join('');
    openSheet(`<h2 id="sheetTitle">Cell tower</h2>
      <div class="coords">${t.lat.toFixed(6)}, ${t.lng.toFixed(6)}</div>
      ${me?`<span class="dist">${distLabel(t)}</span>`:''}
      <div class="note-body">${owner?esc(owner):'Licensee not listed'}${call?`<br><span class="note-empty" style="font-style:normal">Call sign ${esc(call)}</span>`:''}${h?`<br>Height: ${esc(h)}`:''}${city?`<br>${esc(city)}${st?', '+esc(st):''}`:''}</div>
      <details class="meta"><summary>All FCC details</summary><div style="margin-top:6px;line-height:1.5">${extra||'None'}</div></details>
      <div class="row"><button class="b-primary" id="tNav">Directions</button><button class="b-flag" id="tPin">Pin it</button></div>`);
    $('tNav').onclick=()=>window.open(`https://www.google.com/maps/dir/?api=1&destination=${t.lat},${t.lng}`,'_blank');
    $('tPin').onclick=()=>{newPinAt(t.lat,t.lng);setTimeout(()=>{const f=$('fTitle');if(f)f.value='Cell tower'+(owner?' – '+owner:'')},30)};
  }

  const OVERLAYS={
    chart:{name:'Nautical chart depths',desc:'NOAA charts with depth soundings and contours — coast, bays, big rivers and some large lakes',
      layer:new EsriExport('https://gis.charttools.noaa.gov/arcgis/rest/services/MCS/NOAAChartDisplay/MapServer/exts/MaritimeChartService/MapServer/export',{maxZoom:20,opacity:.9,zIndex:5,attribution:'Charts © NOAA'})},
    marks:{name:'Buoys & markers',desc:'Channel markers, buoys and lights (OpenSeaMap)',
      layer:L.tileLayer('https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png',{maxZoom:20,maxNativeZoom:18,zIndex:6,attribution:'© OpenSeaMap'})},
    sst:{name:'Ocean water temp',desc:'NASA daily sea-surface temperature, about 1 km detail',temp:'Ocean water temp',
      layer:L.tileLayer(gibs('GHRSST_L4_MUR_Sea_Surface_Temperature'),{maxZoom:20,maxNativeZoom:7,opacity:.65,zIndex:4,attribution:'SST © NASA GIBS'})},
    towers:{name:'Cell towers',desc:'FCC-licensed cellular sites near you. Not every carrier site is listed. Zoom in to load',layer:towers},

  };
  const PREF='onpoint.layers.v1';
  let layerState={base:'street',on:[]};
  try{const v=JSON.parse(localStorage.getItem(PREF));if(v&&BASES[v.base])layerState={base:v.base,on:(v.on||[]).filter(k=>OVERLAYS[k])}}catch(e){}
  function applyLayers(){
    Object.entries(BASES).forEach(([k,b])=>{if(k===layerState.base){if(!map.hasLayer(b.layer))b.layer.addTo(map)}else map.removeLayer(b.layer)});
    Object.entries(OVERLAYS).forEach(([k,o])=>{if(layerState.on.includes(k)){if(!map.hasLayer(o.layer))o.layer.addTo(map)}else map.removeLayer(o.layer)});

    try{localStorage.setItem(PREF,JSON.stringify(layerState))}catch(e){}
  }

  function showLayers(){
    const base=Object.entries(BASES).map(([k,b])=>`<button class="opt" role="radio" aria-checked="${k===layerState.base}" data-base="${k}"><span><span class="ot">${b.name}</span><span class="od">${b.desc}</span></span><span class="mk"></span></button>`).join('');
    const ov=Object.entries(OVERLAYS).map(([k,o])=>`<button class="opt sw-t" aria-pressed="${layerState.on.includes(k)}" data-ov="${k}"><span><span class="ot">${o.name}</span><span class="od">${o.desc}</span></span><span class="mk"></span></button>`).join('');

    $('bases').onclick=e=>{const b=e.target.closest('[data-base]');if(!b)return;layerState.base=b.dataset.base;applyLayers();
      $('bases').querySelectorAll('[data-base]').forEach(x=>x.setAttribute('aria-checked',x===b));};
    $('ovs').onclick=e=>{const b=e.target.closest('[data-ov]');if(!b)return;const k=b.dataset.ov;

      b.setAttribute('aria-pressed',layerState.on.includes(k));

  }
  $('layerBtn').onclick=showLayers;

  let calTick=null;
  function showCalibrate(){
    enableCompass(true);
    openSheet(`<h2 id="sheetTitle">Calibrate compass</h2>
      <p class="fine" style="margin-top:4px">First, wave your phone in a slow figure‑8 a few times, away from cars and metal. Then fine‑tune with one of these.</p>
      <div class="sec">Easiest: match to GPS</div>
      <p class="fine" style="margin-top:0">Walk or ride in a straight line holding the phone pointed straight ahead, then tap the button. GPS knows your true direction, so the compass gets corrected to it.</p>
      <div id="calLive" class="meta" style="margin:8px 0">Waiting for readings…</div>
      <div class="row" style="margin-top:6px"><button class="b-flag" id="calGps">Match to GPS now</button></div>
      <div class="sec">Or adjust by hand</div>
      <p class="fine" style="margin-top:0">Point the phone at something you can see on the map (down a straight road, at a building), then slide until the orange beam points at it.</p>
      <input type="range" id="calSlide" min="-90" max="90" step="1" value="${Math.round(compassOffset)}" style="width:100%;margin:10px 0" aria-label="Compass correction in degrees">
      <div class="meta" id="calVal"></div>

    const showVal=()=>{$('calVal').textContent=`Correction: ${compassOffset>0?'+':''}${Math.round(compassOffset)}°`;$('calSlide').value=Math.round(compassOffset)};
    showVal();
    calTick=()=>{const el=$('calLive');if(!el)return;
      const g=(gpsSpeed>=1&&gpsHeading!=null)?Math.round(gpsHeading)+'°':'not moving';
      el.textContent=`Compass: ${compassH==null?'—':Math.round(compassH)+'°'}   ·   GPS travel: ${g}`;};
    calTick();
    $('calSlide').oninput=e=>{setOffset(+e.target.value);showVal()};
    $('calGps').onclick=()=>{
      if(compassRaw==null){toast('No compass reading yet — allow motion access');return}
      if(!(gpsSpeed>=1&&gpsHeading!=null)){toast('Start moving in a straight line first');return}
      let off=((gpsHeading-compassRaw)%360+540)%360-180;setOffset(off);showVal();toast(`Corrected by ${Math.round(off)}°`);
    };
    $('calReset').onclick=()=>{setOffset(0);showVal();toast('Correction cleared')};
    $('calDone').onclick=()=>{calTick=null;closeSheet()};
  }

  const flagIcon=c=>L.divIcon({className:'flag-pin',iconSize:[28,40],iconAnchor:[5,38],popupAnchor:[8,-34],
    html:`<svg width="28" height="40" viewBox="0 0 28 40"><path d="M5 2v36" stroke="#1C252C" stroke-width="3" stroke-linecap="round"/><path d="M6 3h19l-5 7 5 7H6z" fill="${c}" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/><circle cx="5" cy="38" r="2.2" fill="#1C252C"/></svg>`});

  const markers=new Map();
  function drawPin(p){
    if(markers.has(p.id)) map.removeLayer(markers.get(p.id));
    const m=L.marker([p.lat,p.lng],{icon:flagIcon(p.color),title:p.title||'Pin'}).addTo(map);
    m.on('click',()=>showPin(p.id));
    markers.set(p.id,m);
  }
  pins.forEach(drawPin);

  // ---------- you ----------
  let me=null, meMarker=null, meCircle=null, follow=true;
  // Looking cone is amber and longer so it reads clearly apart from the blue travel arrow
  const youIcon=L.divIcon({className:'',iconSize:[110,110],iconAnchor:[55,55],
    html:'<div class="you"><svg class="cone" viewBox="0 0 110 110"><defs><radialGradient id="cg" cx="55" cy="55" r="55" gradientUnits="userSpaceOnUse"><stop offset=".15" stop-color="#F28C28" stop-opacity=".75"/><stop offset="1" stop-color="#F28C28" stop-opacity="0"/></radialGradient></defs><path d="M55 55 L36 2 A56 56 0 0 1 74 2 Z" fill="url(#cg)"/><path d="M55 55 L55 6" stroke="#F28C28" stroke-width="2" stroke-dasharray="3 4" stroke-linecap="round"/></svg><div class="you-dot"></div><svg class="arrow" viewBox="0 0 32 32"><path d="M16 2 28 28 16 22 4 28Z" fill="#1E7FD8" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/></svg></div>'});
  let gpsHeading=null,gpsSpeed=0;
  function onPos(pos){
    const {latitude:lat,longitude:lng,accuracy:acc}=pos.coords;
    const first=!me; me={lat,lng,acc}; lastFix=Date.now();
    gpsSpeed=pos.coords.speed||0;
    gpsHeading=(typeof pos.coords.heading==='number'&&!isNaN(pos.coords.heading))?pos.coords.heading:null;
    if(!meMarker){meMarker=L.marker([lat,lng],{icon:youIcon,interactive:false,zIndexOffset:1000}).addTo(map);
      meCircle=L.circle([lat,lng],{radius:acc,color:'#1E7FD8',weight:1,fillOpacity:.1,interactive:false}).addTo(map);}
    else{meMarker.setLatLng([lat,lng]);meCircle.setLatLng([lat,lng]).setRadius(acc);}
    if(first) map.setView([lat,lng],17);
    else if(follow) map.panTo([lat,lng],{animate:true});
    $('locBtn').classList.toggle('on',follow);
    updateReadout();drawDirection();
    if(headingOn){const t=currentHeading();if(t!=null&&(lastSet==null||Math.abs(((t-lastSet+540)%360)-180)>=2)){lastSet=t;map.setBearing(-t)}}
  }
  function onErr(e){
    const msg=e.code===1?'Location is blocked. Allow location for this page in your browser settings.':
      e.code===3?'Still looking for a GPS fix…':'Location unavailable right now.';
    $('readout').textContent=e.code===1?'Location off':'No fix yet';
    toast(msg);
  }
  // Phones (especially iPhones) quietly stop GPS updates after the screen locks or the app is
  // switched away. Restart the watch when the page comes back, and if updates stall, restart it
  // and ask for a fresh fix directly.
  let watchId=null,lastFix=0;
  const GEO_OPTS={enableHighAccuracy:true,maximumAge:0,timeout:15000};
  function startGeo(){
    if(!('geolocation' in navigator)){$('readout').textContent='No GPS';return}
    if(watchId!=null)navigator.geolocation.clearWatch(watchId);
    watchId=navigator.geolocation.watchPosition(onPos,onErr,GEO_OPTS);
  }
  function poke(){if('geolocation' in navigator)navigator.geolocation.getCurrentPosition(onPos,()=>{},GEO_OPTS)}
  startGeo();
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){startGeo();poke()}});
  window.addEventListener('pageshow',()=>{startGeo();poke()});
  window.addEventListener('focus',poke);
  setInterval(()=>{
    if(document.visibilityState!=='visible'||!me)return;
    const age=Date.now()-lastFix;
    if(age>12000){startGeo();poke()}
    updateReadout();
  },5000);
  function stopFollow(){if(follow){follow=false;$('locBtn').classList.remove('on')}}
  map.on('dragstart',stopFollow);
  (function(){
    const el=map.getContainer();let sx=0,sy=0,down=false;
    el.addEventListener('touchstart',e=>{if(e.touches.length>1)stopFollow();else{down=true;sx=e.touches[0].clientX;sy=e.touches[0].clientY}},{passive:true});
    el.addEventListener('touchmove',e=>{if(e.touches.length>1)stopFollow();else if(down&&Math.hypot(e.touches[0].clientX-sx,e.touches[0].clientY-sy)>8)stopFollow()},{passive:true});
    el.addEventListener('touchend',()=>{down=false},{passive:true});
    el.addEventListener('wheel',stopFollow,{passive:true});
    el.addEventListener('dblclick',stopFollow);
  })();
  $('locBtn').onclick=()=>{
    enableCompass(false);
    if(!me){toast('Waiting for your location…');return}
    follow=true;$('locBtn').classList.add('on');map.setView([me.lat,me.lng],Math.max(map.getZoom(),16));
  };

  function updateReadout(){
    if(!me) return;
    const age=Math.round((Date.now()-lastFix)/1000);
    const fresh=age<8?'live':age<60?age+'s ago':Math.round(age/60)+' min ago';
    $('readout').innerHTML=`<b>${me.lat.toFixed(5)}, ${me.lng.toFixed(5)}</b><br>±${fmtDist(me.acc)} · ${fresh}`;
  }

  // ---------- compass & rotation ----------
  // One compass reading feeds both the direction cone on your dot and heading-up mode.
  let headingOn=false,compassH=null,compassRaw=null,compassState='off',lastT=0,lastSet=null;
  // Calibration offset (degrees) added to the phone's compass, saved on this phone
  let compassOffset=0;
  try{const v=parseFloat(localStorage.getItem('onpoint.compassOffset'));if(isFinite(v))compassOffset=v}catch(e){}
  function setOffset(v){
    compassOffset=((v%360)+540)%360-180;
    try{localStorage.setItem('onpoint.compassOffset',String(compassOffset))}catch(e){}
    if(compassRaw!=null){compassH=(compassRaw+compassOffset+360)%360;drawDirection()}
  }
  function updateNeedle(){const b=canRotate?map.getBearing():0;$('needle').style.transform=`rotate(${b}deg)`;drawDirection();}
  map.on('rotate',updateNeedle);
  // Standing or walking: compass (the way the phone points). Driving: the compass is thrown off by
  // the car's metal and the phone is sitting in a mount, so switch to GPS direction of travel.
  // Switch on above ~8 mph, back to compass below ~4 mph so it doesn't flicker at stoplights.
  let driving=false,lastDriveH=null;
  function currentHeading(){
    if(!driving&&gpsSpeed>=3.6)driving=true;
    else if(driving&&gpsSpeed<1.8)driving=false;
    if(driving){if(gpsHeading!=null)lastDriveH=gpsHeading;if(lastDriveH!=null)return lastDriveH}
    return compassH;
  }
  // Two indicators: the cone = where the phone is pointing (compass);
  // the arrow (replaces the dot) = the last direction you traveled (GPS), kept when you stop.
  let moving=false,lastTravelH=null;
  try{const v=parseFloat(localStorage.getItem('onpoint.travelH'));if(isFinite(v))lastTravelH=v}catch(e){}
  function drawDirection(){
    const el=meMarker&&meMarker.getElement();if(!el)return;
    const you=el.querySelector('.you'),cone=el.querySelector('.cone'),arrow=el.querySelector('.arrow');
    const b=canRotate?map.getBearing():0;
    if(compassH==null)cone.classList.remove('on');
    else{cone.classList.add('on');cone.style.transform=`rotate(${compassH+b}deg)`;}
    if(!moving&&gpsSpeed>=1.1)moving=true;else if(moving&&gpsSpeed<0.5)moving=false;
    // Only trust GPS direction while actually moving; when you stop, keep the last one
    if(moving&&gpsHeading!=null&&gpsHeading!==lastTravelH){lastTravelH=gpsHeading;try{localStorage.setItem('onpoint.travelH',String(lastTravelH))}catch(e){}}
    const show=lastTravelH!=null;
    you.classList.toggle('moving',show);
    if(show)arrow.style.transform=`rotate(${lastTravelH+b}deg)`;
  }
  function onOrient(e){
    let h=null;
    if(typeof e.webkitCompassHeading==='number')h=e.webkitCompassHeading;
    else if((e.absolute||e.type==='deviceorientationabsolute')&&typeof e.alpha==='number')h=360-e.alpha;
    if(h==null)return;
    const ang=(screen.orientation&&screen.orientation.angle)||window.orientation||0;
    h=(h+ang+360)%360;
    const now=performance.now();if(now-lastT<80)return;lastT=now;
    compassRaw=h;compassH=(h+compassOffset+360)%360;drawDirection();if(calTick)calTick();
    if(headingOn){const t=currentHeading();
      if(lastSet==null||Math.abs(((t-lastSet+540)%360)-180)>=2){lastSet=t;map.setBearing(-t)}}
  }
  const needsPermission=typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function';
  async function enableCompass(loud){
    if(compassState==='on')return true;
    if(typeof DeviceOrientationEvent==='undefined'){if(loud)toast('This phone has no compass access');return false}
    if(needsPermission){
      try{const r=await DeviceOrientationEvent.requestPermission();if(r!=='granted'){compassState='denied';if(loud)toast('Compass access was declined');return false}}
      catch(e){if(loud)toast('Compass isn’t available here');return false}

  }
  if(!needsPermission)enableCompass(false);   // Android: no prompt needed
  else {
    setTimeout(()=>{if(compassState!=='on')toast('Tap the locate button to turn on the compass')},4000);
    // iPhones only allow the compass prompt after a tap, so ask on the first tap anywhere
    document.addEventListener('click',()=>{if(compassState==='off')enableCompass(false)},{once:true,capture:true});
  }
  async function startHeading(){
    if(!(await enableCompass(true)))return;
    headingOn=true;lastSet=null;
    $('compassBtn').classList.add('head');
    if(me&&follow)map.setView([me.lat,me.lng],Math.max(map.getZoom(),16));
    toast('Map turns with you — tap again for north up');
    setTimeout(()=>{if(headingOn&&currentHeading()==null)toast('No compass reading from this phone')},2500);
  }
  function stopHeading(){headingOn=false;$('compassBtn').classList.remove('head');}
  $('compassBtn').onclick=()=>{
    if(!canRotate){toast('Rotation didn’t load — check your connection');return}
    if(headingOn){stopHeading();map.setBearing(0);toast('North up');return}
    if(Math.abs(map.getBearing())>1){map.setBearing(0);toast('North up — tap again to follow your heading');return}
    startHeading();
  };

  // ---------- helpers ----------
  function haversine(a,b){const R=6371000,r=x=>x*Math.PI/180;
    const dLat=r(b.lat-a.lat),dLng=r(b.lng-a.lng);
    const h=Math.sin(dLat/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLng/2)**2;
    return 2*R*Math.asin(Math.sqrt(h));}
  function bearing(a,b){const r=x=>x*Math.PI/180;
    const y=Math.sin(r(b.lng-a.lng))*Math.cos(r(b.lat));
    const x=Math.cos(r(a.lat))*Math.sin(r(b.lat))-Math.sin(r(a.lat))*Math.cos(r(b.lat))*Math.cos(r(b.lng-a.lng));
    const deg=(Math.atan2(y,x)*180/Math.PI+360)%360;
    return ['N','NE','E','SE','S','SW','W','NW'][Math.round(deg/45)%8];}
  function fmtDist(m){const ft=m*3.28084;return ft<1000?Math.round(ft)+' ft':(m/1609.344).toFixed(m<16093?1:0)+' mi';}
  function fmtDate(t){return new Date(t).toLocaleString([], {month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'});}
  function distLabel(p){return me?`${fmtDist(haversine(me,p))} ${bearing(me,p)}`:''}
  function waterText(p){return [p.depth!=null?p.depth+' ft deep':'',p.temp!=null?p.temp+'°F water':''].filter(Boolean).join(' · ')}
  function waterChips(p){return [p.depth!=null?`<span class="dist">↧ ${p.depth} ft</span>`:'',p.temp!=null?`<span class="dist">🌡 ${p.temp}°F</span>`:''].join('')}
  function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),2800);}
  function setCount(){$('count').textContent=pins.length}
  setCount();
  if(pins.length){setTimeout(()=>$('hint').style.opacity=0,3500)} else {setTimeout(()=>$('hint').style.opacity=0,7000)}

  // ---------- sheet ----------
  let draft=null, draftMarker=null;
  function openSheet(html){$('sheetBody').innerHTML=html;$('sheet').classList.add('show');$('scrim').classList.add('show');}
  function closeSheet(){
    $('sheet').classList.remove('show');$('scrim').classList.remove('show');

    if(document.activeElement) document.activeElement.blur();
  }
  $('scrim').onclick=closeSheet;
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

  function editor(p,isNew){
    draft={...p};
    const sw=COLORS.map(c=>`<button type="button" class="sw" style="background:${c}" data-c="${c}" aria-label="Color ${c}" aria-pressed="${c===draft.color}"></button>`).join('');
    openSheet(`
      <h2 id="sheetTitle">${isNew?'New pin':'Edit pin'}</h2>
      <div class="coords">${draft.lat.toFixed(6)}, ${draft.lng.toFixed(6)}${me?' &nbsp;·&nbsp; '+distLabel(draft)+' from you':''}</div>
      <label class="f" for="fTitle">Name</label>
      <input type="text" id="fTitle" maxlength="80" placeholder="Truck parking, fishing spot, cache…" value="${esc(draft.title)}">
      <div class="two">
        <div><label class="f" for="fDepth">Depth (ft)</label><input type="text" inputmode="decimal" id="fDepth" placeholder="—" value="${draft.depth??''}"></div>
        <div><label class="f" for="fTemp">Water temp (°F)</label><input type="text" inputmode="decimal" id="fTemp" placeholder="—" value="${draft.temp??''}"></div>
      </div>
      <label class="f" for="fNote">Notes</label>
      <textarea id="fNote" placeholder="Anything you want to remember here">${esc(draft.note)}</textarea>
      <label class="f">Flag color</label>
      <div class="swatches" id="sws">${sw}</div>
      <div class="row"><button class="b-ghost" id="cancelB">Cancel</button><button class="b-flag" id="saveB">Save pin</button></div>`);
    $('sws').onclick=e=>{const b=e.target.closest('.sw');if(!b)return;draft.color=b.dataset.c;
      $('sws').querySelectorAll('.sw').forEach(x=>x.setAttribute('aria-pressed',x===b));
      if(draftMarker)draftMarker.setIcon(flagIcon(draft.color));};
    $('cancelB').onclick=closeSheet;
    $('saveB').onclick=()=>{
      draft.title=$('fTitle').value.trim()||'Untitled pin';
      draft.note=$('fNote').value;
      const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:null};
      draft.depth=num($('fDepth').value);draft.temp=num($('fTemp').value);
      draft.updated=Date.now();

      if(i>=0)pins[i]=draft;else pins.unshift(draft);
      save();drawPin(draft);setCount();
      const saved=draft; if(draftMarker){map.removeLayer(draftMarker);draftMarker=null} draft=null;
      closeSheet();toast(isNew?'Pin saved':'Changes saved');

    };

  }

  function newPinAt(lat,lng){
    const p={id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),lat,lng,title:'',note:'',color:COLORS[0],created:Date.now()};
    if(draftMarker) map.removeLayer(draftMarker);

  }

  function showPin(id){
    const p=pins.find(x=>x.id===id);if(!p)return;
    follow=false;$('locBtn').classList.remove('on');
    map.panTo([p.lat,p.lng]);
    openSheet(`
      <h2 id="sheetTitle"><span style="color:${p.color}">⚑</span> ${esc(p.title)}</h2>
      <div class="coords">${p.lat.toFixed(6)}, ${p.lng.toFixed(6)}</div>
      ${me?`<span class="dist">${distLabel(p)}</span>`:''}
      ${waterChips(p)?`<div class="chips">${waterChips(p)}</div>`:''}
      <div class="note-body ${p.note?'':'note-empty'}">${p.note?esc(p.note):'No notes yet.'}</div>
      <div class="meta">Pinned ${fmtDate(p.created)}${p.updated&&p.updated-p.created>60000?' · edited '+fmtDate(p.updated):''}</div>
      <div class="row"><button class="b-primary" id="navB">Directions</button><button class="b-ghost" id="editB">Edit</button></div>
      <div class="row" style="margin-top:10px"><button class="b-ghost" id="copyB">Copy coordinates</button><button class="b-danger" id="delB">Delete</button></div>`);
    $('navB').onclick=()=>window.open(`https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}`,'_blank');
    $('editB').onclick=()=>editor(p,false);
    $('copyB').onclick=async()=>{try{await navigator.clipboard.writeText(`${p.lat.toFixed(6)}, ${p.lng.toFixed(6)}`);toast('Coordinates copied')}catch(e){toast(`${p.lat.toFixed(6)}, ${p.lng.toFixed(6)}`)}};
    $('delB').onclick=()=>{
      if(!confirm(`Delete "${p.title}"? This can't be undone.`))return;
      pins=pins.filter(x=>x.id!==p.id);save();
      if(markers.has(p.id)){map.removeLayer(markers.get(p.id));markers.delete(p.id)}
      setCount();closeSheet();toast('Pin deleted');
    };
  }

  function showList(){
    const sorted=[...pins].sort((a,b)=>me?haversine(me,a)-haversine(me,b):b.created-a.created);
    const items=sorted.map(p=>`<li><button data-id="${p.id}"><span class="dot" style="background:${p.color}"></span>
      <span><span class="t">${esc(p.title)}</span><span class="s">${[waterText(p),esc((p.note||'').split('\n')[0])].filter(Boolean).join(' · ')||'No notes'}</span></span>
      <span class="d">${distLabel(p)}</span></button></li>`).join('');
    openSheet(`<h2 id="sheetTitle">Your pins</h2>
      <div class="coords">${pins.length?(me?'Closest first':'Newest first'):''}</div>
      ${pins.length?`<ul class="list" id="plist">${items}</ul>`:'<div class="empty">No pins yet. Tap anywhere on the map, or use “Pin where I am” to mark your spot.</div>'}
      <div class="tools"><button id="expB">Export backup</button><button id="impB">Import backup</button></div>`);
    if(pins.length) $('plist').onclick=e=>{const b=e.target.closest('button[data-id]');if(b)showPin(b.dataset.id)};
    $('expB').onclick=exportPins;
    $('impB').onclick=()=>$('importFile').click();
  }

  function exportPins(){
    if(!pins.length){toast('No pins to export');return}
    const blob=new Blob([JSON.stringify({app:'on-point',version:1,exported:Date.now(),pins},null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download=`on-point-pins-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
    toast('Backup exported');
  }
  $('importFile').onchange=async e=>{
    const f=e.target.files[0];e.target.value='';if(!f)return;
    try{
      const data=JSON.parse(await f.text());const list=Array.isArray(data)?data:data.pins;
      if(!Array.isArray(list))throw 0;
      let added=0;
      list.forEach(p=>{if(typeof p.lat!=='number'||typeof p.lng!=='number'||!p.id)return;
        if(pins.some(x=>x.id===p.id))return;
        pins.push({id:p.id,lat:p.lat,lng:p.lng,title:String(p.title||'Untitled pin'),note:String(p.note||''),depth:typeof p.depth==='number'?p.depth:null,temp:typeof p.temp==='number'?p.temp:null,color:COLORS.includes(p.color)?p.color:COLORS[0],created:p.created||Date.now(),updated:p.updated});
        drawPin(pins[pins.length-1]);added++;});
      save();setCount();closeSheet();toast(added?`Imported ${added} pin${added>1?'s':''}`:'No new pins in that file');
    }catch(err){toast('That file isn’t an On Point backup')}
  };

  // ---------- actions ----------
  map.on('click',e=>{ if($('sheet').classList.contains('show')){closeSheet();return} $('hint').style.opacity=0; newPinAt(e.latlng.lat,e.latlng.lng); });
  $('pinHereBtn').onclick=()=>{ if(!me){toast('No GPS fix yet — tap the map to pin a spot instead');return} newPinAt(me.lat,me.lng); };
  $('listBtn').onclick=showList;
})();
</script>
</body>
</html>
